<!doctype html><html><head><meta charset="utf-8"><title>Purchase pending save — isolated preview</title><style>body{margin:0;font:12px Arial}header{padding:8px;background:#fff3d6;display:flex;gap:10px;align-items:center}iframe{width:100%;height:850px;border:0}</style></head><body>
<header>ISOLATED SAMPLE — no CMS writes. <button id="receipt">Confirm original receipt</button><button id="reject">Reject original save</button><span id="trace">No submission</span></header>
<iframe id="room" src="../../../purchase-live/index.html?preview=20261014-save-navigation-v1"></iframe><script>
const frame=document.querySelector('#room');let original=null,submits=0;
const task={id:'PREVIEW-TASK',customerId:'PREVIEW-CUSTOMER',orderId:'PREVIEW-ORDER',barcode:'95510000000001',name:'SAMPLE PRODUCT FOR PENDING SAVE',packing:'24 x 100G',ea:24,ord:100,inc:null,supplierId:'PREVIEW-SUPPLIER',po:'',lpPc:2,lpCtn:48,disc1:0,disc2:0,disc3:0,netCostCtn:48,costStatus:'CAPTURED',history:[],masterReceivedAt:'2026-10-14T02:00:00Z',stage:'WAITING_FOR_PO',editVersion:'PREVIEW-V1',gp:.12,procurement:{totalCtn:100,revision:'PREVIEW-P1',draftPlan:true}};
const other={...task,id:'OTHER-TASK',customerId:'OTHER-CUSTOMER',orderId:'OTHER-ORDER',barcode:'95510000000002',name:'SECOND CUSTOMER PRODUCT',history:[]};
const workspace={company:'NCT',staff:{staffId:'PREVIEW-NAV',memberId:'PREVIEW-NAV',staffName:'PREVIEW',canEditCustomerDemand:false},fetchedAt:new Date().toISOString(),customers:[{id:'PREVIEW-CUSTOMER',name:'SAMPLE CUSTOMER',shortName:'SAMPLE'},{id:'OTHER-CUSTOMER',name:'SECOND CUSTOMER',shortName:'SECOND'}],suppliers:[{id:'PREVIEW-SUPPLIER',name:'SAMPLE SUPPLIER',shortName:'SAMPLE'}],tasks:[task,other]};
function send(type,m,result){frame.contentWindow.postMessage({type,requestId:m.requestId,company:m.company,ok:true,result},'*');}
window.addEventListener('message',event=>{if(event.source!==frame.contentWindow)return;const m=event.data;if(m.type==='PURCHASE_WORKSPACE_REQUEST')frame.contentWindow.postMessage({type:'PURCHASE_WORKSPACE_RESULT',requestId:m.requestId,company:m.company,ok:true,workspace:{...workspace,company:m.company}},'*');if(m.type==='PURCHASE_ORDERS_REQUEST')send('PURCHASE_ORDERS_RESULT',m,{company:m.company,orders:[]});if(m.type==='PURCHASE_SAVE_REQUEST'){original=m;submits++;document.querySelector('#trace').textContent='Submit count '+submits+' · Ref '+m.requestId+' · Cost '+(m.input?.prices?.lpCtn??'—');send('PURCHASE_SAVE_RESULT',m,{ok:false,pending:true,requestId:m.requestId,errorCode:'WDE0118',error:'Sample CMS connection WDE0118; result pending.'});}if(m.type==='PURCHASE_SAVE_CHECK_REQUEST')send('PURCHASE_SAVE_CHECK_RESULT',m,{ok:false,pending:true,requestId:m.saveRequestId});});
document.querySelector('#receipt').onclick=()=>{if(original){if(original.operation==='PLAN'){Object.assign(task,original.input.prices||{});task.editVersion='PREVIEW-SAVED';task.procurement={...task.procurement,totalCtn:original.input.totalCtn,revision:'PREVIEW-SAVED'};}send('PURCHASE_SAVE_RESULT',original,{ok:true,requestId:original.requestId});}};
document.querySelector('#reject').onclick=()=>{if(original)send('PURCHASE_SAVE_RESULT',original,{ok:false,requestId:original.requestId,error:'Check supplier costs and discounts.'});};
</script></body></html>
