<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Local Stock Workspace Test</title><link rel="stylesheet" href="../../../account-room/style.css"><link rel="stylesheet" href="../../../master-shared/stock-exceptions.css"></head><body>
<header class="department-header"><label>Company <select id="company"><option>NCT</option><option>GHR</option></select></label><strong>Warehouse Department · LOCAL TEST</strong></header><nav><button>Goods Receiving / 收货</button></nav><main><p>Local fixture only / 本地测试，不会保存线上数据</p><label>Test role / 测试身份 <select id="role"><option>WAREHOUSE</option><option>PURCHASE</option><option>ADMIN</option><option>ACCOUNT</option></select></label><pre id="captured"></pre></main>
<script>
const source={id:'SOURCE',barcode:'9551234567890',name:'CHOCOLATE BISCUITS',packing:'24 x 100G',po:'NCT-PO-TEST',supplierName:'SUPPLIER A SDN BHD',availablePhysical:170,received:480};
const cases=[{id:'DAMAGE',sourceTaskId:'SOURCE',company:'NCT',quantity:5,kind:'INTERNAL_DAMAGE',reason:'Post-receipt inspection',referenceCostCents:50000,status:'OPEN',owner:'ACCOUNT',at:'2026-10-12T03:00:00Z',by:'Hia',byStaffId:'WAREHOUSE',source,resolution:{adminApproval:{outcome:'LOSS',quantity:5,cents:50000,by:'Yeoyo',byStaffId:'ADMIN',at:'2026-10-12T03:20:00Z',reason:'Verified damage'}}},{id:'WRONG',sourceTaskId:'SOURCE',company:'NCT',quantity:3,kind:'WRONG_ITEM',reason:'Strawberry flavour found',referenceCostCents:30000,status:'OPEN',owner:'PURCHASE',at:'2026-10-12T03:00:00Z',by:'Hia',source},{id:'EXPIRY',sourceTaskId:'SOURCE',company:'NCT',quantity:2,kind:'SHORT_EXPIRY',reason:'Two months remaining',referenceCostCents:20000,status:'OPEN',owner:'WAREHOUSE',at:'2026-10-12T03:00:00Z',by:'Hia',source,resolution:{decision:{value:'REPLACE',disposition:'RETURN',supplierReference:'Supplier agrees',expectedDate:'2026-10-15',by:'Law',at:'2026-10-12T03:10:00Z'}}}];
window.addEventListener('message',event=>{const m=event.data||{};if(m.type==='STOCK_READ_REQUEST'){const role=document.getElementById('role').value;parent.postMessage({type:'STOCK_READ_RESULT',company:m.company,requestId:m.requestId,ok:true,result:{company:m.company,version:'STOCK-V',resolutionVersion:'RESOLUTION-V',sources:[source],cases,permissions:{report:role==='WAREHOUSE',decide:role==='PURCHASE',approve:role==='ADMIN',close:role==='ACCOUNT'}}},'*');}if(m.type==='STOCK_SAVE_REQUEST'){document.getElementById('captured').textContent=JSON.stringify(m.input,null,2);parent.postMessage({type:'STOCK_SAVE_RESULT',company:m.company,requestId:m.requestId,ok:true,result:{ok:false,retryable:false,error:'Local payload captured / 本地已核对输入，未保存线上数据。'}},'*');}});
</script><script src="../../../master-shared/stock-exceptions.js"></script></body></html>
