<!doctype html><html><head><meta charset="utf-8"><title>Purchase save diagnostics — isolated preview</title><style>body{margin:0;font:13px Arial}header{padding:8px;background:#fff3d6}iframe{width:100%;height:850px;border:0}</style></head><body>
<header>ISOLATED SAMPLE — no CMS writes. <label>Simulated response <select id="outcome"><option value="validation">Validation error</option><option value="cms">CMS connection error</option></select></label> <button id="receipt">Confirm original receipt</button> <span id="trace"></span></header>
<iframe id="room" src="../../../purchase-live/index.html"></iframe><script>
const frame=document.querySelector('#room');let original=null,submits=0;
const task={id:'PREVIEW-TASK',customerId:'PREVIEW-CUSTOMER',orderId:'PREVIEW-ORDER',barcode:'95510000000001',name:'SAMPLE PRODUCT FOR SAVE DIAGNOSTICS',packing:'24 x 100G',ea:24,ord:100,inc:null,supplierId:'PREVIEW-SUPPLIER',po:'',lpPc:2,lpCtn:48,disc1:0,disc2:0,disc3:0,netCostCtn:48,costStatus:'CAPTURED',history:[],masterReceivedAt:'2026-10-14T02:00:00Z',stage:'WAITING_FOR_PO',editVersion:'PREVIEW-V1',gp:.12,procurement:{totalCtn:100,revision:'PREVIEW-P1',draftPlan:true}};
const workspace={company:'NCT',staff:{staffId:'PREVIEW',memberId:'PREVIEW',staffName:'PREVIEW',canEditCustomerDemand:false},fetchedAt:new Date().toISOString(),customers:[{id:'PREVIEW-CUSTOMER',name:'SAMPLE CUSTOMER',shortName:'SAMPLE'}],suppliers:[{id:'PREVIEW-SUPPLIER',name:'SAMPLE SUPPLIER',shortName:'SAMPLE'}],tasks:[task]};
function send(type,m,result){frame.contentWindow.postMessage({type,requestId:m.requestId,company:m.company,ok:true,result},'*');}
window.addEventListener('message',event=>{if(event.source!==frame.contentWindow)return;const m=event.data;if(m.type==='PURCHASE_WORKSPACE_REQUEST')frame.contentWindow.postMessage({type:'PURCHASE_WORKSPACE_RESULT',requestId:m.requestId,company:m.company,ok:true,workspace},'*');if(m.type==='PURCHASE_ORDERS_REQUEST')send('PURCHASE_ORDERS_RESULT',m,{company:'NCT',orders:[]});if(m.type==='PURCHASE_SAVE_REQUEST'){original=m;submits++;document.querySelector('#trace').textContent='Submit count '+submits+' · Ref '+m.requestId;send('PURCHASE_SAVE_RESULT',m,document.querySelector('#outcome').value==='cms'?{ok:false,pending:true,requestId:m.requestId,errorCode:'WDE0118',error:'Master CMS connection is not confirmed (WDE0118). Input retained; refresh Master, then retry the same save / CMS连接未确认，输入保留；刷新Master后重试同一次保存。'}:{ok:false,requestId:m.requestId,error:'A procurement reason is required.'});}if(m.type==='PURCHASE_SAVE_CHECK_REQUEST')send('PURCHASE_SAVE_CHECK_RESULT',m,{ok:false,pending:true,requestId:m.saveRequestId});});
document.querySelector('#receipt').onclick=()=>{if(original)send('PURCHASE_SAVE_RESULT',original,{ok:true,requestId:original.requestId});};
</script></body></html>
