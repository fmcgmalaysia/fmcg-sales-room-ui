addEventListener('message',event=>{if(event.source!==document.getElementById('sales').contentWindow)return;const m=event.data||{};if(m.type==='SALES_ROOM_READY'||m.type==='SALES_ROOM_CUSTOMERS_REQUEST'){send('SALES_ROOM_STAFF',{staff:{staffId:'DEMO',staffName:'Demo Staff',role:'ADMIN',canViewAllCustomers:true}});load()}if(m.type==='SALES_ROOM_CONFIRMED_ORDERS_REQUEST')send('SALES_ROOM_CONFIRMED_ORDERS',{ok:true,orders});if(m.type==='SALES_ROOM_ORDER_DETAIL_REQUEST')send('SALES_ROOM_ORDER_DETAIL',{ok:true,order:orders.find(o=>o.orderId===m.orderId)});if(m.type==='SALES_ROOM_ORDER_PROGRESS_REQUEST')send('SALES_ROOM_ORDER_PROGRESS',{ok:true,requestId:m.requestId,customerShortName:'SCOMM',currency:'MYR',orders});if(m.type==='SALES_ROOM_ORDER_PLANNING_UPDATE'){const order=orders.find(o=>o.orderId===m.orderId);if(failSave){failSave=false;send('SALES_ROOM_ORDER_PLANNING_RESULT',{ok:false,requestId:m.requestId,error:'Demo temporary save failure'});return}if(order.revision!==m.expectedRevision||(order.destination&&order.shipmentDateRevision!==m.expectedShipmentRevision)){send('SALES_ROOM_ORDER_PLANNING_RESULT',{ok:false,requestId:m.requestId,error:'Revision changed'});return}Object.assign(order,{customerPoNumber:m.customerPoNumber,estimatedShipmentDate:m.estimatedShipmentDate,revision:order.destination?order.revision:order.revision+1,shipmentDateRevision:order.destination?'DATE-'+Date.now():undefined,shipmentDateUpdatedAt:new Date().toISOString(),shipmentDateUpdatedBy:'Demo Staff'});send('SALES_ROOM_ORDER_PLANNING_RESULT',{ok:true,requestId:m.requestId,orderId:m.orderId,message:'Demo order details saved'})}});
</script></body></html>
