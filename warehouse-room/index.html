<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="build" content="20261115-master-compact-workrooms-v1"><title>Warehouse Department</title><link rel="stylesheet" href="../account-room/style.css?v=20261111-warehouse-desk-workflow-v1"><link rel="stylesheet" href="style.css?v=20261114-warehouse-product-photo-preview-v1"><link rel="stylesheet" href="../master-shared/task-signals.css?v=20261018-warehouse-workroom-v1"><script src="../master-shared/task-signals.js?v=20261018-task-chat-drive-v1"></script><link rel="stylesheet" href="../master-shared/stock-exceptions.css?v=20261114-warehouse-stock-issues-v1"><link rel="stylesheet" href="../master-shared/workroom-theme.css?v=20261018-warehouse-workroom-v1"><script defer src="../master-shared/fixed-header.js?v=20261018-warehouse-workroom-v1"></script><link rel="stylesheet" href="../master-shared/task-chat.css?v=20261115-master-compact-workrooms-v1"><link rel="stylesheet" href="workroom.css?v=20261115-master-compact-workrooms-v1"><link rel="stylesheet" href="../master-shared/mobile-menu.css?v=20261018-department-mobile-qty-v1"><link rel="stylesheet" href="../master-shared/quantity-alignment.css?v=20261018-department-mobile-qty-v1"><script src="../master-shared/shipment-batches.js?v=20261101-customer-loaded-records-v1"></script><link rel="stylesheet" href="../master-shared/action-affordances.css?v=20261020-action-affordances-v1"><link rel="stylesheet" href="../master-shared/desk-delivery.css?v=20261115-master-compact-workrooms-v1"></head>
<body>
<header class="department-header"><strong class="master-brand">MASTER</strong><label><span class="company-label">Company</span><select id="company" aria-label="Company 公司"><option value="NCT">North Cape Trading · NCT</option><option value="GHR">Global HR · GHR</option></select></label><strong class="department-name">Warehouse Department</strong><span id="staff" class="staff">Connecting 正在连接</span></header>
<nav aria-label="Warehouse navigation"><button data-view="receiving" class="active">Incoming Tasks</button><button data-view="customers">Delivery Task</button><details class="wh-history-menu"><summary>History</summary><div><button data-view="history">Incoming</button><button data-delivery-history>Delivery</button></div></details><button id="openStockControl" data-view="stock">Stock List</button><button type="button" data-view="issues">Stock Issues</button><span id="readAt" class="preview"></span></nav>
<div id="taskSignals" style="margin:0 24px"></div><main><div class="title-row"><h1 id="title">Incoming Tasks 入库任务</h1><div><button id="login" hidden>Sign in</button> <button id="refresh">Refresh</button></div></div>
<div id="notice" class="account-notice" role="status">正在连接 Master…</div><section id="track" class="warehouse-track" aria-label="Receiving overview"></section>
<div class="filters"><div class="receiving-status-filter" role="group" aria-label="Receiving task status 收货任务状态"><button type="button" id="receivingProgress" aria-pressed="true"><span>In Progress</span><small>进行中</small><b id="receivingProgressCount"></b></button><button type="button" id="receivingComplete" aria-pressed="false"><span>Completed Tasks</span><small>本月完成</small><b id="receivingCompleteCount"></b></button></div><select id="supplier" aria-label="Supplier"><option value="">All Suppliers 全部供应商</option></select><input id="search" aria-label="Search" placeholder="Search P.O., supplier or customer 搜索"><select id="customer" aria-label="Customer 客户" hidden><option value="">All Customers 全部客户</option></select><span id="customerQty" hidden></span><input id="month" aria-label="Month 月份" type="month" hidden></div>
<div id="tables"></div><section id="warehouseStockIssues" hidden></section></main>
<dialog id="entry" aria-labelledby="entrySupplier"><div class="dialog-header"><div><h2 id="entryTitle" hidden></h2><strong id="entrySupplier"></strong><p id="entryPo"></p></div><button id="closeEntry" aria-label="Close">×</button></div><div class="dialog-body"><div class="account-notice" id="entryWarning"></div><div class="receipt-columns" aria-hidden="true"><span>No.</span><span>Product <small>产品</small></span><span>Expected <small>应收</small></span><span>Receipt <small>收货</small></span><span>Pending <small>待收</small></span><span>Photo <small>照片</small></span></div><div id="entryLines"></div><details id="receiptDetails"><summary>Receipt History 收货记录</summary><div id="entryHistory"></div></details><p id="entryError" role="alert"></p></div><footer><button id="cancelEntry">Cancel</button><button class="primary" id="saveReceipt">Confirm</button></footer></dialog>
<dialog id="receiptPhotoViewer" aria-labelledby="receiptPhotoTitle"><header><strong id="receiptPhotoTitle"></strong><form method="dialog"><button type="submit" aria-label="Close photo 关闭照片" autofocus>×</button></form></header><img id="receiptPhotoImage" alt="Receipt photo 收货照片"></dialog>
<script src="../master-shared/task-chat.js?v=20261103-department-chat-prompts-v1"></script><script src="workroom.js?v=20261114-warehouse-incoming-heading-v1"></script><script src="dispatch.js?v=20261018-warehouse-workroom-v1"></script><script src="stock-control-link.js?v=20261114-warehouse-product-photo-preview-v1"></script><script src="../master-shared/desk-delivery.js?v=20261114-support-warehouse-desk-sync-v2"></script><script src="app.js?v=20261114-warehouse-stock-issues-v1"></script><script src="../master-shared/stock-exceptions.js?v=20261114-warehouse-stock-issues-v1"></script><script src="../master-shared/mobile-menu.js?v=20261018-department-mobile-qty-v1"></script></body></html>
