<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="build" content="2026-10-18-fixed-header-v1"><title>Warehouse Department</title><link rel="stylesheet" href="../account-room/style.css?v=20261018-fixed-header-v1"><link rel="stylesheet" href="style.css?v=20261018-fixed-header-v1"><link rel="stylesheet" href="../master-shared/task-signals.css?v=20261018-fixed-header-v1"><script src="../master-shared/task-signals.js?v=20261018-fixed-header-v1"></script><link rel="stylesheet" href="../master-shared/stock-exceptions.css?v=20261018-fixed-header-v1"><link rel="stylesheet" href="../master-shared/workroom-theme.css?v=20261018-fixed-header-v1"><script defer src="../master-shared/fixed-header.js?v=20261018-fixed-header-v1"></script></head>
<body>
<header class="department-header"><strong class="master-brand">MASTER</strong><label><span class="company-label">Company</span><select id="company" aria-label="Company 公司"><option value="NCT">North Cape Trading · NCT</option><option value="GHR">Global HR · GHR</option></select></label><strong class="department-name">Warehouse Department <small lang="zh-CN">仓库部</small></strong><span id="staff" class="staff">员工身份待连接</span></header>
<nav aria-label="Warehouse navigation"><button data-view="receiving" class="active">Goods Receiving 收货</button><button data-view="customers">Customer Readiness 客户备货</button><button data-view="dispatch">Customer Dispatch 客户发货</button><button data-view="history">Receiving History 收货历史</button><span id="readAt" class="preview"></span></nav>
<div id="taskSignals" style="margin:0 24px"></div><main><div class="title-row"><h1 id="title">Goods Receiving 仓库收货</h1><div><button id="login">Sign in 登录</button> <button id="refresh">Refresh 刷新</button></div></div>
<div id="notice" class="account-notice" role="status">正在连接 Master…</div><section id="track" class="warehouse-track" aria-label="Receiving overview"></section>
<div class="filters"><input id="search" aria-label="Search" placeholder="Search P.O. / supplier / customer · 搜索"><select id="supplier" aria-label="Supplier"><option value="">All Suppliers 全部供应商</option></select><select id="customer" aria-label="Customer 客户" hidden><option value="">All Customers 全部客户</option></select><span id="customerQty" hidden></span><input id="month" aria-label="Month 月份" type="month" hidden></div>
<div id="tables"></div></main>
<dialog id="entry" aria-labelledby="entryTitle"><div class="dialog-header"><div><h2 id="entryTitle">Receive Delivery 登记本次收货</h2><strong id="entrySupplier"></strong><p id="entryPo"></p></div><button id="closeEntry" aria-label="Close">×</button></div><div class="dialog-body"><div class="account-notice">只填写本次到货；系统自动累计。破损／错货填入拒收，不计入可用数量。</div><div id="entryLines"></div><details><summary>Receipt History 收货记录</summary><div id="entryHistory"></div></details><p id="entryError" role="alert"></p></div><footer><button id="cancelEntry">Cancel 取消</button><button class="primary" id="saveReceipt">Save Receipt 保存收货</button></footer></dialog>
<script src="dispatch.js?v=20261018-fixed-header-v1"></script><script src="app.js?v=20261018-fixed-header-v1"></script><script src="../master-shared/stock-exceptions.js?v=20261018-fixed-header-v1"></script></body></html>
