<!doctype html>
<!-- 20261117-catalogue-layout-v1 -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="catalogue-header-build-version" content="2026-09-30-catalogue-buyer-room-link-v52">
  <meta name="catalogue-mobile-header-build" content="20261120-catalogue-compact-navigation-v1">
  <meta name="catalogue-layout-refinement-build" content="20261128-catalogue-layout-refinement-v1">
  <meta name="catalogue-masthead-account-build" content="20261128-catalogue-masthead-account-v1">
  <link rel="stylesheet" href="https://fmcgmalaysia.github.io/fmcg-sales-room-ui/account-menu/account-menu.css?v=20261126-account-menu-v1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#102a4a;--ink:#172b4a;--line:#e3e8ee;--orange:#f05a28;--burnt:#b7431d;--soft:#fff3ed}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:'Wix Madefor Text',Arial,sans-serif;color:var(--ink);background:#fff}button{font:inherit}
    .header,.navrow{height:67px}.header{background:#fff;border-bottom:1px solid var(--line)}.navrow{display:flex;align-items:center;background:#fff}
    .page-id{flex:0 0 auto;height:43px;display:flex;align-items:center;gap:10px;margin:0 9px 0 18px;padding:0 18px;border:1px solid #ffd5c4;border-radius:999px;background:var(--soft);color:var(--burnt);font-size:15px;font-weight:800;letter-spacing:.09em;white-space:nowrap;user-select:none}.page-id svg{width:22px;height:22px;flex:none;fill:currentColor}
    .nav{min-width:0;flex:1;height:100%;display:flex;align-items:stretch;justify-content:flex-start;gap:5px;padding:0 8px;background:#fff}.navbtn{position:relative;border:0;background:#fff;color:#172b4a;display:flex;align-items:center;justify-content:center;padding:0 13px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}.navbtn:after{content:"";position:absolute;left:13px;right:13px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--orange);transform:scaleX(0);transition:transform .16s ease}.navbtn:hover,.navbtn.active{color:var(--burnt);background:#fffaf7}.navbtn:hover:after,.navbtn.active:after{transform:scaleX(1)}
    .nav-actions{display:flex;align-items:center;padding:0 22px 0 10px;background:#fff}.buyer-room{height:42px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 18px;border:1px solid var(--navy);border-radius:10px;background:var(--navy);color:#fff;text-decoration:none;font-size:14px;font-weight:750;letter-spacing:.005em;cursor:pointer;white-space:nowrap;box-shadow:none;transition:background .16s ease}.buyer-room:hover{background:#173b63}.buyer-room:focus-visible{outline:3px solid rgba(16,42,74,.2);outline-offset:2px}.buyer-room svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}.buyer-room .arrow{font-size:17px;font-weight:500;opacity:.82}
    @media(max-width:1100px){.page-id{height:40px;margin-left:12px;padding:0 13px;font-size:12px;letter-spacing:.06em}.page-id svg{width:18px;height:18px}.nav{gap:1px;padding:0 4px}.navbtn{padding:0 8px;font-size:12px}.navbtn:after{left:8px;right:8px}.nav-actions{padding:0 10px 0 5px}.buyer-room{height:40px;padding:0 12px;font-size:12px}}
    @media(max-width:750px){.header,.navrow{height:52px}.page-id{height:36px;margin-left:7px;padding:0 10px;gap:6px;font-size:10px;letter-spacing:.03em}.page-id svg{width:16px;height:16px}.nav{gap:2px;padding:0 5px;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.navbtn{flex:0 0 auto;padding:0 9px;font-size:11px}.navbtn:after{left:9px;right:9px;height:2px}.nav-actions{padding:0 7px 0 4px}.buyer-room{width:40px;height:38px;padding:0;border-radius:9px}.buyer-room .label,.buyer-room .arrow{display:none}.buyer-room svg{width:19px;height:19px}}

    .buyer-room[aria-disabled="true"]{opacity:.58;cursor:default}
    .mobile-brand,.mobile-tools{display:none}
    @media(max-width:900px){
      .header{height:auto}.nav{display:none}
      .navrow{height:auto;display:grid;grid-template-columns:minmax(0,1fr) 56px;grid-template-rows:54px auto}
      .mobile-brand{grid-area:1/1/2/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:center;gap:10px;height:54px;padding:0 64px 0 12px;background:#f4511e;color:#fff}
      .mobile-brand img{display:block;width:min(100%,178px);height:auto}
      .mobile-identity{min-width:0;text-align:right;line-height:1.15}
      .mobile-identity strong,.mobile-identity span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .mobile-identity strong{font-size:12px}.mobile-identity span{margin-top:3px;font-size:11px}
      .page-id{display:none}
      .mobile-tools{grid-area:2/1/3/-1;display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:6px 12px}
      .mobile-category{display:grid;place-items:center;width:44px;height:44px;padding:0;border:1px solid #c8d3df;border-radius:8px;background:#fff;color:var(--navy);cursor:pointer}
      .mobile-category:focus-visible,.mobile-search:focus-within{outline:2px solid #244b73;outline-offset:1px}
      .mobile-category svg,.mobile-search svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
      .mobile-search{display:flex;align-items:center;min-width:0;gap:8px;height:44px;padding:0 10px;border:1px solid #c8d3df;border-radius:8px;color:#576b82}
      .mobile-search input{width:100%;min-width:0;padding:0;border:0;outline:0;background:transparent;color:var(--navy);font:inherit;font-size:16px}
      .nav-actions{grid-area:1/2/2/3;z-index:1;padding:0;margin-right:12px;background:transparent}
      .buyer-room{width:44px;height:44px;padding:0;gap:0}.buyer-room .label,.buyer-room .arrow{display:none}
    }
    .catalogue-brand-home{display:inline-flex;align-items:center;justify-content:flex-start;min-height:44px;padding:0;border:0;background:none;cursor:pointer}
    .catalogue-brand-home img{display:block}
    .catalogue-brand-home:focus-visible{outline:2px solid #fff;outline-offset:4px}
    @media(min-width:901px){
      .page-id{border:0;border-radius:7px;background:#fff;color:var(--navy);cursor:pointer}
      .page-id:is(:hover,:focus-visible){background:#eef3f7;color:#102a4a}
      .page-id:focus-visible{outline:2px solid #406382;outline-offset:2px}
      .buyer-room{border-color:#164f53;background:#164f53}
      .buyer-room:not([aria-disabled="true"]):hover{border-color:#103e42;background:#103e42}
      .buyer-room:focus-visible{outline-color:#1d7373}
    }
    @media(min-width:901px) and (prefers-reduced-motion:no-preference){
      .buyer-room .arrow{transition:transform .18s ease-out}
      .buyer-room:not([aria-disabled="true"]):is(:hover,:focus-visible) .arrow{transform:translateX(4px)}
    }
  </style>
<meta name="header-account-menu-build" content="20261127-catalogue-top-account-v2">
<style>
  .catalogue-account-entry{position:absolute;z-index:2;top:10px;right:22px;clip-path:inset(50%);min-height:44px;padding:0 12px;border:1px solid #c8d3df;border-radius:8px;background:#fff;color:var(--navy);font:inherit;cursor:pointer}
  .catalogue-account-entry:focus{clip-path:none;outline:2px solid #244b73;outline-offset:1px}
  .catalogue-account-entry svg{display:none}
  html.catalogue-account-menu-open,
  html.catalogue-account-menu-open body{background:transparent}
  dialog.catalogue-account-menu.account-menu-panel{
    top:2px;right:clamp(20px,1.56vw,31px);width:min(210px,calc(100vw - 16px));padding:5px;
    border-color:#ccd6e0;border-radius:8px;color:var(--navy);font-size:14px
  }
  .catalogue-account-menu button{font-weight:650}
  .catalogue-account-menu button:hover{background:var(--soft)}
  @media(min-width:901px){
    html.catalogue-account-menu-open .header{transform:translateY(18px)}
  }
  @media(max-width:900px){
    .mobile-brand{padding-right:108px}
    .catalogue-account-entry{display:grid;place-items:center;top:5px;right:57px;width:44px;clip-path:none;padding:0;border:0;background:transparent;color:#fff}
    .catalogue-account-entry:focus{outline-color:#fff;outline-offset:-2px}
    .catalogue-account-entry span{display:none}
    .catalogue-account-entry svg{display:block;width:23px;height:23px;fill:currentColor}
    dialog.catalogue-account-menu.account-menu-panel{top:52px;right:57px;width:min(210px,calc(100vw - 65px))}
  }
</style>
</head>
<body>
  <header class="header"><div class="navrow">
    <div class="mobile-brand">
      <button class="catalogue-brand-home" type="button" aria-label="FMCG Malaysia Catalogue home"><img src="https://static.wixstatic.com/media/4ecd18_975cadc3143943aaa22d52c441ab059b~mv2.png" alt=""></button>
      <div class="mobile-identity"><strong id="mobileCompany"></strong><span id="mobileActor"></span></div>
    </div>
    <button class="page-id" type="button" aria-label="Catalogue home"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M15.2 7.1C11.7 4.5 8.3 3.5 3 3.6v21.1c5.1-.2 8.7.7 12.2 3.4V7.1Zm1.6 0c3.5-2.6 6.9-3.6 12.2-3.5v21.1c-5.1-.2-8.7.7-12.2 3.4V7.1Z"/><path d="M1 7.6h1v19.3c5.4-.5 9.6.4 14 3 4.4-2.6 8.6-3.5 14-3V7.6h1v21.1c-6.2-.7-10.8.2-15 3.3-4.2-3.1-8.8-4-15-3.3V7.6Z"/></svg><span>CATALOGUE</span></button>
    <nav class="nav" aria-label="Catalogue categories"><button class="navbtn" data-key="FOOD" type="button"><span>Food &amp; Beverages</span></button><button class="navbtn" data-key="HOUSEHOLDS" type="button"><span>Household &amp; Cleaning</span></button><button class="navbtn" data-key="PERSONAL CARE" type="button"><span>Personal Care &amp; Health</span></button><button class="navbtn" data-key="OTHERS" type="button"><span>General Merchandise</span></button></nav>
    <div class="mobile-tools">
      <button id="mobileCategory" type="button" class="mobile-category" aria-label="Browse product categories" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <label class="mobile-search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg>
      <input id="mobileSearch" type="search" aria-label="Search products, brands or categories" placeholder="Search products" autocomplete="off">
      </label>
    </div>
    <button class="catalogue-account-entry" type="button" aria-label="Account menu" aria-haspopup="dialog"><span>Account menu</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M3 21c0-4 4-7 9-7s9 3 9 7H3z"/></svg></button>
    <div class="nav-actions"><a class="buyer-room" id="buyerRoom" target="fmcgBuyerRoom" aria-disabled="true" aria-label="Open Buyer Room"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 5h2l1.5 9.1h10.4l2.1-6.3H6.1M9.2 18.5a1.2 1.2 0 1 0 0 .1M17 18.5a1.2 1.2 0 1 0 0 .1"/></svg></span><span class="label">Buyer Room</span><span class="arrow" aria-hidden="true">→</span></a></div>
  </div></header>
  <dialog class="account-menu-panel catalogue-account-menu" id="catalogueAccountMenu" aria-label="Account">
    <button type="button" class="account-menu-profile">View My Selection</button>
    <button type="button" class="account-menu-logout">Log Out</button>
    <button type="button" class="account-menu-signin" hidden>Sign In</button>
    <p class="account-menu-message" role="status"></p>
  </dialog>
  <script>
    const post=(type,payload={})=>window.parent.postMessage({type,...payload},'*');
    document.querySelector('.catalogue-account-entry').addEventListener('click',()=>post('catalogueOpenAccountMenu'));
    const buttons=[...document.querySelectorAll('.navbtn')];const buyerRoom=document.getElementById('buyerRoom');let active='',hoverTimer,staffPreview=false,buyerRoomPending=false;
    buyerRoom.addEventListener('click',event=>{
      if(!buyerRoom.hasAttribute('href')||buyerRoomPending){event.preventDefault();return}
      if(staffPreview||matchMedia('(max-width:900px)').matches){event.preventDefault();post('catalogueBuyerRoom')}
    });
    function paint(){buttons.forEach(button=>{const open=button.dataset.key===active;button.classList.toggle('active',open);button.setAttribute('aria-expanded',String(open))})}
    function openMenu(button){active=button.dataset.key;paint();post('catalogueMain',{main:active,anchor:button.getBoundingClientRect().left,open:true})}
    buttons.forEach(button=>{
      button.setAttribute('aria-expanded','false');
      button.addEventListener('mouseenter',()=>{clearTimeout(hoverTimer);hoverTimer=setTimeout(()=>openMenu(button),220)});
      button.addEventListener('mouseleave',()=>clearTimeout(hoverTimer));
      button.addEventListener('click',()=>{
        clearTimeout(hoverTimer);
        if(active===button.dataset.key){const main=active;active='';paint();post('catalogueMain',{main,open:false})}
        else openMenu(button);
      });
      button.addEventListener('keydown',event=>{if(event.key==='Escape'&&active){event.preventDefault();clearTimeout(hoverTimer);const main=active;active='';paint();post('catalogueMain',{main,open:false})}});
    });
    const mobileCategory=document.getElementById('mobileCategory');
    mobileCategory.onclick=()=>post('catalogueMobileCategories',{open:mobileCategory.getAttribute('aria-expanded')!=='true'});
    document.querySelector('.nav').addEventListener('mouseleave',()=>post('catalogueMegaLeave'));
    const mobileSearch=document.getElementById('mobileSearch');
    let mobileSearchTimer;
    document.querySelectorAll('.page-id,.catalogue-brand-home').forEach(button=>{
      button.addEventListener('click',()=>{
        clearTimeout(hoverTimer);
        clearTimeout(mobileSearchTimer);
        post('catalogueHome');
      });
    });
    const sendSearch=()=>{clearTimeout(mobileSearchTimer);post('catalogueSearch',{query:mobileSearch.value})};
    mobileSearch.addEventListener('input',()=>{clearTimeout(mobileSearchTimer);mobileSearchTimer=setTimeout(sendSearch,240)});
    mobileSearch.addEventListener('keydown',event=>{if(event.key==='Enter'){sendSearch();mobileSearch.blur()}});
    window.addEventListener('message',event=>{
      const data=event.data||{};
      if(data.type==='catalogueContext'){
        const href=String(data.buyerRoomUrl||'').trim();
        if(href){
          staffPreview=data.mode==='preview';
          buyerRoom.href=href;
          buyerRoom.removeAttribute('aria-disabled');
          buyerRoom.querySelector('.label').textContent=staffPreview?'Choose customer':'Buyer Room';
          buyerRoom.setAttribute('aria-label',staffPreview?'Choose a customer in Sales Room':'Open Buyer Room');
        }
        for(const [id,value] of [['mobileCompany',data.sheetName],['mobileActor',data.signedInName]]){
          const label=document.getElementById(id);label.textContent=String(value||'').trim();label.title=label.textContent
        }
      }else if(data.type==='catalogueBuyerRoomPending'){
        buyerRoomPending=Boolean(data.pending);buyerRoom.setAttribute('aria-disabled',String(buyerRoomPending));
        buyerRoom.setAttribute('aria-busy',String(buyerRoomPending));
        buyerRoom.querySelector('.label').textContent=buyerRoomPending?'Opening…':staffPreview?'Choose customer':'Buyer Room';
      }else if(data.type==='catalogueMobileCategoriesState'&&event.source===parent){
        mobileCategory.setAttribute('aria-expanded',String(Boolean(data.open)));
        if(!data.open&&data.returnFocus&&matchMedia('(max-width:900px)').matches)mobileCategory.focus({preventScroll:true});
      }else if(data.type==='catalogueHeaderFilter'){
        clearTimeout(mobileSearchTimer);
        mobileSearch.value=String(data.query||'');
      }else if(data.type==='megaState'){active=data.open?String(data.main||''):'';paint()}
    });
    const announceReady=()=>post('catalogueHeaderReady');announceReady();[250,1000,3000].forEach(delay=>setTimeout(announceReady,delay));
  </script>
  <script type="module">
    import { requestFrameLogout } from 'https://fmcgmalaysia.github.io/fmcg-sales-room-ui/account-menu/frame-logout.js?v=20261126-account-menu-v1';

    const menu = document.getElementById('catalogueAccountMenu');
    const accountEntry = document.querySelector('.catalogue-account-entry');
    const mySelection = menu.querySelector('.account-menu-profile');
    const logout = menu.querySelector('.account-menu-logout');
    const signIn = menu.querySelector('.account-menu-signin');
    const status = menu.querySelector('.account-menu-message');
    const request = type => parent.postMessage({ type }, '*');
    const close = () => { if (menu.open && !logout.disabled) menu.close(); };

    window.addEventListener('message', event => {
      if (event.source !== parent || event.data?.type !== 'catalogueAccountMenu' || logout.disabled) return;
      if (menu.open) { close(); return; }
      const guest = event.data.signedIn !== true;
      mySelection.hidden = guest || event.data.canViewSelection !== true;
      logout.hidden = guest;
      signIn.hidden = !guest;
      status.textContent = '';
      document.documentElement.classList.add('catalogue-account-menu-open');
      accountEntry.setAttribute('aria-expanded', 'true');
      menu.showModal();
      (guest ? signIn : mySelection.hidden ? logout : mySelection).focus();
    });
    menu.addEventListener('click', event => {
      if (event.target !== menu) return;
      const rect = menu.getBoundingClientRect();
      if (event.clientX < rect.left || event.clientX >= rect.right ||
          event.clientY < rect.top || event.clientY >= rect.bottom) close();
    });
    menu.addEventListener('close', () => {
      document.documentElement.classList.remove('catalogue-account-menu-open');
      accountEntry.setAttribute('aria-expanded', 'false');
      request('catalogueAccountMenuClosed');
    });
    menu.addEventListener('cancel', event => { if (logout.disabled) event.preventDefault(); });
    window.addEventListener('blur', close);
    mySelection.addEventListener('click', () => { close(); request('catalogueBuyerRoom'); });
    signIn.addEventListener('click', () => request('catalogueAccountSignIn'));
    logout.addEventListener('click', async () => {
      logout.disabled = true;
      status.textContent = 'Signing out…';
      try {
        await requestFrameLogout(() => request('catalogueAccount'));
      } catch {
        status.textContent = 'Could not sign out. Try again.';
      } finally { logout.disabled = false; }
    });
    request('catalogueAccountMenuReady');
    [250,1000,3000].forEach(delay => setTimeout(() => request('catalogueAccountMenuReady'), delay));
  </script>
</body>
</html>
