<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--blue:#112f51;--ink:#172b4a;--muted:#64738a;--line:#eadfd8;--orange:#f05a28;--menu:#fffaf6}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;font-family:'Wix Madefor Text',sans-serif;color:var(--ink);background:transparent}
    button{font-family:'Wix Madefor Text',sans-serif}
    .panel{display:none;width:100%;height:100%;min-height:330px;background:var(--menu);border-bottom:3px solid var(--orange);box-shadow:0 18px 32px rgba(19,35,75,.16);overflow:hidden}
    .panel.show{display:grid;grid-template-columns:minmax(520px,1.22fr) minmax(400px,1fr)}
    .left{min-width:0;padding:20px 26px 18px;border-right:1px solid #eadfd8;background:#fff}
    .sublist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:column;grid-template-rows:repeat(var(--rows,6),34px);column-gap:25px;align-content:start}
    .sub{width:100%;min-width:0;display:flex;align-items:center;gap:10px;border:0;border-radius:6px;padding:0 10px;background:transparent;color:#203454;text-align:left;font-size:13px;font-weight:600;line-height:1.18;cursor:pointer;transition:background .2s ease,color .2s ease}
    .sub-symbol{width:9px;height:9px;flex:none;border:1.5px solid #8b99aa;transform:rotate(45deg);transition:transform .25s ease,border-color .25s ease,background .25s ease}
    .sub span:last-child{transition:transform .22s ease}
    .sub:hover,.sub:focus-visible,.sub.active{color:#a8401b;background:#fff3eb}
    .sub:hover .sub-symbol,.sub:focus-visible .sub-symbol,.sub.active .sub-symbol{transform:rotate(135deg);border-color:var(--orange);background:var(--orange)}
    .sub:hover span:last-child,.sub:focus-visible span:last-child{transform:translateX(3px)}
    .sub.active{font-weight:600}
    .right{min-width:0;min-height:0;display:flex;flex-direction:column;padding:18px 20px 10px;background:#fff6ef}
    .brands{display:grid;width:100%;margin:0 auto;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,80px);gap:8px;align-content:start}
    .brand{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:0;border-radius:10px;background:transparent;padding:3px;color:var(--ink);text-align:center;cursor:pointer}
    .brand-mark{width:52px;height:52px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #eadfd8;border-radius:50%;background:#fff;padding:7px;color:#19346d;font-size:8px;font-weight:700;line-height:1.05;overflow-wrap:anywhere;transition:border-color .18s ease,box-shadow .18s ease,background .18s ease}
    .brand:hover .brand-mark,.brand:focus-visible .brand-mark{border-color:#f05a28;background:#fff8f3;box-shadow:0 5px 15px rgba(200,73,24,.14)}
    .brand-mark img{display:block;width:100%;height:100%;object-fit:contain;border-radius:50%}
    .brand-name{display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:400;color:#2a3954}
    .empty{grid-column:1/-1;grid-row:1/-1;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:24px}
    .pager{height:26px;margin-top:auto;display:flex;align-items:center;justify-content:center;gap:20px}
    .pager button{width:28px;height:28px;border:0;background:transparent;color:var(--blue);font-size:21px;line-height:1;cursor:pointer}
    .pager button:disabled{color:#b8c2d0;cursor:default}
    .pager span{min-width:34px;text-align:center;color:var(--muted);font-size:12px}
    @media(max-width:900px){
      .panel{min-height:0;max-height:78vh;overflow-y:auto;border-bottom-width:2px}
      .panel.show{display:block}
      .left{border-right:0;padding:14px 14px 12px}
      .sublist{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row;grid-template-rows:none;column-gap:8px;row-gap:4px}
      .sub{min-height:42px;padding:4px 8px;font-size:12px}
      .right{display:flex;padding:14px 12px 10px;border-top:1px solid #eadfd8}
      .brands{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:none;gap:10px 4px}
      .brand{min-height:82px;padding:2px}
      .brand-mark{width:54px;height:54px}
      .brand-name{font-size:10px;line-height:1.15;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
      .pager{margin-top:10px}
    }
    @media(max-width:480px){.brands{grid-template-columns:repeat(3,minmax(0,1fr))}.brand-mark{width:58px;height:58px}.sublist{grid-template-columns:1fr 1fr}}
    @media(prefers-reduced-motion:reduce){.sub,.sub-symbol,.sub span:last-child{transition:none}}
  </style>
</head>
<body>
  <section id="panel" class="panel" aria-label="Catalogue mega menu" aria-hidden="true">
    <div class="left"><div id="sublist" class="sublist" role="group" aria-label="Subcategories"></div></div>
    <div class="right">
      <div id="brands" class="brands" aria-live="polite"></div>
      <div class="pager"><button id="prev" type="button" aria-label="Previous brands">‹</button><span id="pageLabel">1 / 1</span><button id="next" type="button" aria-label="Next brands">›</button></div>
    </div>
  </section>
  <script>
    const post=(type,payload={})=>window.parent.postMessage({type,...payload},'*');
    const panel=document.getElementById('panel'),sublist=document.getElementById('sublist'),brandsBox=document.getElementById('brands');
    const pageSize=9;let cmsItems=[],currentMain='FOOD',currentSub=null,principals=[],page=0,requestId=0;
    function setSub(item){if(item?.id===currentSub?.id)return;currentSub=item;page=0;principals=[];
      [...sublist.children].forEach(b=>{const selected=b.dataset.id===item?.id;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected))});
      renderBrands();if(item)post('catalogueRequestPrinciples',{id:item.id,sub:item.title,requestId:++requestId});}
    function renderBrands(){brandsBox.replaceChildren();const pages=Math.max(1,Math.ceil(principals.length/pageSize));page=Math.max(0,Math.min(page,pages-1));
      const visible=principals.slice(page*pageSize,(page+1)*pageSize);
      if(!visible.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=currentSub?'Loading brands…':'Select a subcategory';brandsBox.appendChild(empty)}
      for(const entry of visible){const b=document.createElement('button');b.type='button';b.className='brand';b.setAttribute('aria-label',`View ${entry.name} products`);
        const mark=document.createElement('span');mark.className='brand-mark';
        if(entry.logo&&/^https:\/\//i.test(entry.logo)){const img=document.createElement('img');img.src=entry.logo;img.alt='';img.onerror=()=>{img.remove();mark.textContent=entry.name};mark.appendChild(img)}else{mark.textContent=entry.name}
        const name=document.createElement('span');name.className='brand-name';name.textContent=entry.name;b.append(mark,name);b.onclick=()=>post('cataloguePrinciple',{principle:entry.name,subId:currentSub?.id});brandsBox.appendChild(b)}
      document.getElementById('pageLabel').textContent=`${page+1} / ${pages}`;document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page>=pages-1;}
    function renderMain(main){currentMain=String(main||'FOOD');currentSub=null;sublist.replaceChildren();
      const items=cmsItems.filter(x=>x.mainCategory===currentMain).sort((a,b)=>a.title.localeCompare(b.title));
      sublist.style.setProperty('--rows',String(Math.max(1,Math.ceil(items.length/2))));
      for(const item of items){const b=document.createElement('button');b.type='button';b.className='sub';b.dataset.id=item.id;b.setAttribute('aria-pressed','false');
        const symbol=document.createElement('span');symbol.className='sub-symbol';symbol.setAttribute('aria-hidden','true');
        const label=document.createElement('span');label.textContent=item.title;b.append(symbol,label);
        b.onmouseenter=()=>setSub(item);b.onfocus=()=>setSub(item);b.onclick=()=>{setSub(item);post('catalogueSub',{id:item.id,sub:item.title})};sublist.appendChild(b)}
      setSub(items[0]||null);panel.classList.add('show');panel.setAttribute('aria-hidden','false')}
    document.getElementById('prev').onclick=()=>{page--;renderBrands()};document.getElementById('next').onclick=()=>{page++;renderBrands()};
    panel.addEventListener('mouseenter',()=>post('catalogueMegaEnter'));panel.addEventListener('mouseleave',()=>post('catalogueMegaLeave'));
    window.addEventListener('message',e=>{const d=e.data||{};
      if(d.type==='catalogueMenuData'){cmsItems=Array.isArray(d.items)?d.items:[];if(panel.classList.contains('show'))renderMain(currentMain)}
      if(d.type==='showMain')renderMain(String(d.main||'FOOD'));
      if(d.type==='cataloguePrinciples'&&d.id===currentSub?.id&&d.requestId===requestId){principals=Array.isArray(d.items)?d.items.filter(x=>x&&x.name):[];renderBrands();if(!principals.length)brandsBox.firstChild.textContent='No brands linked to this subcategory yet.'}
    });
    const announceReady=()=>post('catalogueMegaReady');announceReady();[250,1000,3000].forEach(delay=>setTimeout(announceReady,delay));
  </script>
</body>
</html>
