<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="catalogue-header-build-version" content="2026-09-30-catalogue-executive-header-v47">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@400;500;600;700;800&family=Wix+Madefor+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#112f51;--navy2:#d94d1e;--ink:#172b4a;--muted:#64738a;--line:#e7e3df;--orange:#f05a28;--orange2:#ff7b32;--burnt:#a93e19;--soft:#fff1eb}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:'Wix Madefor Text',Arial,sans-serif;color:var(--ink);background:#fff}
    button{font:inherit}.header{height:67px;background:#fff;border-bottom:1px solid var(--line)}
    .navrow{height:67px;display:flex;align-items:stretch;background:#fff}.page-id{position:relative;flex:0 0 205px;display:flex;align-items:center;gap:11px;padding-left:20px;background:linear-gradient(105deg,#c84318,var(--navy2));color:#fff;font-size:16px;font-weight:800;letter-spacing:.105em;white-space:nowrap;user-select:none}.page-id svg{width:24px;height:24px;flex:none;fill:currentColor}.page-id:after{content:"";position:absolute;right:-1px;top:17px;bottom:17px;width:1px;background:rgba(255,255,255,.28)}.nav{min-width:0;flex:1;display:flex;align-items:stretch;justify-content:flex-start;gap:9px;padding:0 16px;background:#fff}.navbtn{position:relative;border:0;background:#fff;color:#172b4a;display:flex;align-items:center;justify-content:center;padding:0 11px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}.navbtn:after{content:"";position:absolute;left:11px;right:11px;bottom:0;height:3px;background:var(--orange);transform:scaleX(0);transition:transform .16s ease}.navbtn:hover,.navbtn.active{color:var(--burnt);background:#fff8f3}.navbtn:hover:after,.navbtn.active:after{transform:scaleX(1)}
    .nav-actions{display:flex;align-items:center;padding:0 22px 0 12px;background:#fff}.buyer-room{height:42px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 19px;border:1px solid #102a4a;border-radius:10px;background:#102a4a;color:#fff;text-decoration:none;font-size:15px;font-weight:750;letter-spacing:.005em;cursor:pointer;white-space:nowrap;box-shadow:none;transition:background .16s ease}.buyer-room:hover{background:#173b63;box-shadow:none}.buyer-room:focus-visible{outline:3px solid rgba(16,42,74,.2);outline-offset:2px}.buyer-room svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}.buyer-room .arrow{font-size:18px;font-weight:500;opacity:.82}
    @media(max-width:1050px){.page-id{flex-basis:162px;gap:8px;padding-left:15px;font-size:13px}.page-id svg{width:19px;height:19px}.nav{padding:0 10px;gap:3px}.navbtn{font-size:12px;padding:0 8px}.nav-actions{padding:0 12px 0 6px}.buyer-room{height:40px;padding:0 12px;font-size:13px}.buyer-room svg{width:18px;height:18px}.buyer-room .arrow{font-size:16px}}
    @media(max-width:750px){
      body{overflow-x:hidden}.header,.navrow{height:52px}
      .page-id{flex-basis:112px;gap:6px;padding-left:9px;font-size:10px;letter-spacing:.04em}.page-id svg{width:16px;height:16px}.nav{display:flex;gap:2px;padding:0 7px;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.navbtn{flex:0 0 auto;padding:0 10px;font-size:11px}.navbtn:after{left:10px;right:10px;height:2px}.nav-actions{padding:0 7px}.buyer-room{width:40px;height:38px;padding:0;border-radius:9px}.buyer-room span:not(.icon){display:none}.buyer-room .arrow{display:none}.buyer-room svg{width:19px;height:19px}
    }
    @media(max-width:390px){.navbtn{padding:0 8px}.nav-actions{padding-left:4px}}
  </style>
</head>

      <nav class="nav" aria-label="Catalogue categories">
