<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="catalogue-header-build-version" content="2026-09-30-catalogue-header-restored-v50">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#102a4a;--ink:#172b4a;--line:#e3e8ee;--orange:#f05a28;--burnt:#b7431d;--soft:#fff3ed}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:'Wix Madefor Text',Arial,sans-serif;color:var(--ink);background:#fff}button{font:inherit}
    .header,.navrow{height:67px}.header{background:#fff;border-bottom:1px solid var(--line)}.navrow{display:flex;align-items:center;background:#fff}
    .page-id{flex:0 0 auto;height:43px;display:flex;align-items:center;gap:10px;margin:0 9px 0 18px;padding:0 18px;border:1px solid #ffd5c4;border-radius:999px;background:var(--soft);color:var(--burnt);font-size:15px;font-weight:800;letter-spacing:.09em;white-space:nowrap;user-select:none}.page-id svg{width:22px;height:22px;flex:none;fill:currentColor}
    .nav{min-width:0;flex:1;height:100%;display:flex;align-items:stretch;justify-content:flex-start;gap:5px;padding:0 8px;background:#fff}.navbtn{position:relative;border:0;background:#fff;color:#172b4a;display:flex;align-items:center;justify-content:center;padding:0 13px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}.navbtn:after{content:"";position:absolute;left:13px;right:13px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--orange);transform:scaleX(0);transition:transform .16s ease}.navbtn:hover,.navbtn.active{color:var(--burnt);background:#fffaf7}.navbtn:hover:after,.navbtn.active:after{transform:scaleX(1)}
    .nav-actions{display:flex;align-items:center;padding:0 22px 0 10px;background:#fff}.buyer-room{height:42px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 18px;border:1px solid var(--navy);border-radius:10px;background:var(--navy);color:#fff;text-decoration:none;font-size:14px;font-weight:750;letter-spacing:.005em;cursor:pointer;white-space:nowrap;box-shadow:none;transition:background .16s ease}.buyer-room:hover{background:#173b63}.buyer-room:focus-visible{outline:3px solid rgba(16,42,74,.2);outline-offset:2px}.buyer-room svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}.buyer-room .arrow{font-size:17px;font-weight:500;opacity:.82}
    @media(max-width:1100px){.page-id{height:40px;margin-left:12px;padding:0 13px;font-size:12px;letter-spacing:.06em}.page-id svg{width:18px;height:18px}.nav{gap:1px;padding:0 4px}.navbtn{padding:0 8px;font-size:12px}.navbtn:after{left:8px;right:8px}.nav-actions{padding:0 10px 0 5px}.buyer-room{height:40px;padding:0 12px;font-size:12px}}
    @media(max-width:750px){.header,.navrow{height:52px}.page-id{height:36px;margin-left:7px;padding:0 10px;gap:6px;font-size:10px;letter-spacing:.03em}.page-id svg{width:16px;height:16px}.nav{gap:2px;padding:0 5px;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.navbtn{flex:0 0 auto;padding:0 9px;font-size:11px}.navbtn:after{left:9px;right:9px;height:2px}.nav-actions{padding:0 7px 0 4px}.buyer-room{width:40px;height:38px;padding:0;border-radius:9px}.buyer-room .label,.buyer-room .arrow{display:none}.buyer-room svg{width:19px;height:19px}}
  </style>
</head>
<body>
  <header class="header"><div class="navrow">
    <div class="page-id" aria-label="Current page: Catalogue"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M15.2 7.1C11.7 4.5 8.3 3.5 3 3.6v21.1c5.1-.2 8.7.7 12.2 3.4V7.1Zm1.6 0c3.5-2.6 6.9-3.6 12.2-3.5v21.1c-5.1-.2-8.7.7-12.2 3.4V7.1Z"/><path d="M1 7.6h1v19.3c5.4-.5 9.6.4 14 3 4.4-2.6 8.6-3.5 14-3V7.6h1v21.1c-6.2-.7-10.8.2-15 3.3-4.2-3.1-8.8-4-15-3.3V7.6Z"/></svg><span>CATALOGUE</span></div>
    <nav class="nav" aria-label="Catalogue categories"><button class="navbtn" data-key="FOOD" type="button"><span>Food &amp; Beverages</span></button><button class="navbtn" data-key="HOUSEHOLDS" type="button"><span>Household &amp; Cleaning</span></button><button class="navbtn" data-key="PERSONAL CARE" type="button"><span>Personal Care &amp; Health</span></button><button class="navbtn" data-key="OTHERS" type="button"><span>General Merchandise</span></button></nav>
    <div class="nav-actions"><button class="buyer-room" id="buyerRoom" type="button" aria-label="Open Buyer Room"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 5h2l1.5 9.1h10.4l2.1-6.3H6.1M9.2 18.5a1.2 1.2 0 1 0 0 .1M17 18.5a1.2 1.2 0 1 0 0 .1"/></svg></span><span class="label">Buyer Room</span><span class="arrow" aria-hidden="true">→</span></button></div>
  </div></header>
  <script>
    const post=(type,payload={})=>window.parent.postMessage({type,...payload},'*');
    const buttons=[...document.querySelectorAll('.navbtn')];let active='',hoverTimer;
    function paint(){buttons.forEach(button=>button.classList.toggle('active',button.dataset.key===active))}
    function openMenu(key){active=key;paint();post('catalogueMain',{main:key,open:true})}
    buttons.forEach(button=>{button.addEventListener('mouseenter',()=>{clearTimeout(hoverTimer);hoverTimer=setTimeout(()=>openMenu(button.dataset.key),220)});button.addEventListener('mouseleave',()=>clearTimeout(hoverTimer));button.addEventListener('click',()=>{clearTimeout(hoverTimer);const same=active===button.dataset.key;active=same?'':button.dataset.key;paint();post('catalogueMain',{main:button.dataset.key,open:!same})})});
    document.querySelector('.nav').addEventListener('mouseleave',()=>post('catalogueMegaLeave'));
    document.getElementById('buyerRoom').addEventListener('click',()=>post('catalogueBuyerRoom'));
    window.addEventListener('message',event=>{const data=event.data||{};if(data.type==='megaState'){active=data.open?String(data.main||''):'';paint()}});
    const announceReady=()=>post('catalogueHeaderReady');announceReady();[250,1000,3000].forEach(delay=>setTimeout(announceReady,delay));
  </script>
</body>
</html>
