<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="catalogue-build-version" content="2026-09-28-catalogue-keyboard-viewport-v20">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:wght@400;500;600;700;800&display=swap');
    :root{--orange:#f05a28;--orange2:#ff7a32;--orange-soft:#fff4ed;--navy:#102a4a;--ink:#142943;--muted:#6d7d90;--line:#dfe6ed;--panel:#fff;--bg:#f6f8fa;--green:#16885f}
    *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Wix Madefor Text',Arial,sans-serif}button,input{font:inherit}
    .shell{height:100vh;min-height:660px;display:grid;grid-template-rows:54px minmax(0,1fr);background:#fff}
    .toolbar{display:grid;grid-template-columns:minmax(300px,1fr) auto;align-items:center;gap:18px;padding:8px 20px;background:#fff;border-bottom:1px solid var(--line)}
    .summary{display:flex;align-items:center;min-width:0}.metric{display:flex;align-items:baseline;gap:7px;min-width:0;padding:0 18px;border:0;border-left:1px solid #d8e0e8;background:transparent;color:#5f7188;font-size:10px;font-weight:800;letter-spacing:.03em;white-space:nowrap}.metric:first-child{padding-left:0;border-left:0}.metric b{color:var(--orange);font-size:16px;letter-spacing:-.2px}.metric em{color:#a7b1bd;font-size:12px;font-style:normal}.metric-value{display:flex;align-items:baseline;gap:5px}.filter{cursor:pointer;border-radius:6px;transition:color .15s,background .15s}.filter:hover{color:var(--navy)}.filter.active{color:#a94219;background:#fff5ef}.filter.active b{color:#a94219}.allowance{margin-left:18px;color:#8592a2;font-size:10px;font-weight:600;white-space:nowrap}.tools{display:flex;align-items:center}.kbd{height:32px;display:flex;align-items:center;gap:7px;border:0;background:transparent;color:#758397;font-size:11px;font-weight:650}.kbd span{display:inline-grid;place-items:center;width:18px;height:18px;border:1px solid #d7dfe7;border-radius:4px;background:#fff;color:var(--navy);font-size:10px}
    .workspace{min-height:0;display:grid;grid-template-columns:minmax(610px,1.25fr) minmax(620px,1fr);gap:0;padding:0 18px 16px;background:#fff}
    .list-panel,.detail{min-height:0;background:#fff;overflow:hidden}.list-panel{border-right:1px solid var(--line);padding-right:16px}.detail{padding-left:20px}
    .list-panel{display:grid;grid-template-rows:39px minmax(0,1fr)}.columns{display:grid;grid-template-columns:70px minmax(250px,1fr) 155px 128px;align-items:center;padding:0 13px;border-bottom:1px solid var(--line);background:#f8fafb;color:#65758a;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.columns span{text-align:left}
    .rows{overflow:auto;scrollbar-width:thin;scrollbar-color:#c9d4df transparent}.empty{display:grid;place-items:center;height:100%;min-height:260px;padding:30px;text-align:center;color:var(--muted)}
    .row{width:100%;height:64px;display:grid;grid-template-columns:70px minmax(250px,1fr) 155px 128px;align-items:center;padding:0 13px;border:0;border-bottom:1px solid #e8edf1;background:#fff;color:inherit;text-align:left;cursor:pointer;transition:background .12s,border-color .12s}.row:hover{background:#fffaf6}.row.active{background:#fff7f2;box-shadow:inset 3px 0 var(--orange)}.thumb{width:56px;height:56px;display:grid;place-items:center;border-radius:6px;background:#f5f7f9;overflow:hidden}.thumb img{display:block;max-width:100%;max-height:100%;object-fit:contain}.fallback{color:#9badba;font-size:9px;font-weight:800}.product{display:block;min-width:0;padding-right:18px}.name{display:block;font-size:11px;font-weight:750;line-height:1.2;color:#122b4b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pack,.brand{display:block;margin-top:3px;font-size:10px;color:#758399;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.barcode{font-size:10px;color:#5a6f87;font-variant-numeric:tabular-nums}.state{text-align:left}.pill{display:inline-flex;align-items:center;justify-content:center;min-width:76px;height:23px;padding:0 10px;border:1px solid #e1e7ec;border-radius:999px;background:#f5f7f9;color:#627287;font-size:8px;font-weight:800;letter-spacing:.055em;text-transform:uppercase}.pill.selected{border-color:#ffd0ba;background:#fff2ea;color:#d94e1e}.pill.selected:before{content:'✓';margin-right:5px;font-size:9px}.pill.busy{color:#a7441e}
    .detail{display:grid;grid-template-rows:72px minmax(0,1fr)}.detail-head{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line)}.detail-title{min-width:0;flex:1}.detail h2{margin:0 0 5px;font-size:21px;font-weight:750;line-height:1.12;letter-spacing:-.35px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.principle{margin:0;color:#7a899b;font-size:11px}.primary{flex:0 0 auto;height:38px;padding:0 17px;border:0;border-radius:6px;background:var(--orange);color:#fff;font-size:10px;font-weight:800;cursor:pointer;white-space:nowrap}.primary:hover{filter:brightness(.97)}.primary.selected{background:#fff0e7;color:var(--orange);border:1px solid #ffc4a8}.primary:disabled{cursor:wait;opacity:.72}.primary.selected:disabled{cursor:default;opacity:1}
    .detail-scroll{min-height:0;overflow:auto;display:grid;grid-template-columns:minmax(345px,1fr) minmax(230px,.82fr);gap:24px;align-items:start;padding:18px 0 14px}.product-image{width:100%;min-width:345px;aspect-ratio:1/1;align-self:start;position:relative;display:grid;place-items:center;background:#fafbfc}.product-image img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain}.product-image .fallback{font-size:12px}.facts-wrap{min-width:0}.facts{display:grid;grid-template-columns:1fr;gap:0}.fact{padding:5px 0 6px}.fact label{display:block;color:#8794a3;font-size:8px;font-weight:700;letter-spacing:0;text-transform:none}.fact span{display:block;margin-top:3px;color:#243c58;font-size:11px;font-weight:650;min-height:13px}.price{margin-top:10px;padding:11px 0 0;border-top:1px solid var(--line);background:transparent}.price-label{font-size:8px;font-weight:700;color:#8794a3;text-transform:none}.price-main{display:flex;align-items:baseline;gap:5px;margin-top:4px;color:var(--orange)}.price-main strong{font-size:21px;letter-spacing:-.4px}.price-main span{font-size:10px;font-weight:800}.price-note{margin-top:3px;color:#8e6b5d;font-size:9px}
    .detail-close{display:none;position:absolute;right:12px;top:10px;z-index:2;width:38px;height:38px;border:1px solid rgba(255,255,255,.45);border-radius:50%;background:rgba(16,42,74,.72);color:#fff;font-size:24px;line-height:1;cursor:pointer}
    @media(max-width:900px){
      .shell{min-height:560px}.workspace{grid-template-columns:1fr;padding:0 9px 9px}.toolbar{grid-template-columns:1fr;padding:8px 12px}.summary{justify-content:flex-start}.metric{padding:0 10px;font-size:9px}.metric b{font-size:14px}.allowance{display:none}.tools{display:none}.list-panel{border-right:0;padding-right:0}
      .columns,.row{grid-template-columns:66px minmax(0,1fr) 92px}.columns span:nth-child(3),.row .barcode{display:none}.columns{padding:0 8px}.row{height:68px;padding:0 8px}.thumb{width:60px;height:60px}.name{font-size:11px}.pack{font-size:10px}.pill{min-width:82px;padding:0 7px}
      .detail{display:grid;position:fixed;inset:0;z-index:30;padding:0 14px;background:#fff;transform:translateX(100%);transition:transform .22s ease;box-shadow:-14px 0 32px rgba(16,42,74,.18)}.detail.mobile-open{transform:translateX(0)}.detail-close{display:block}.detail-head{padding-right:48px}.primary{padding:0 10px}.detail-scroll{display:block;padding:14px 0 24px}.product-image{width:min(100%,345px);min-width:0;aspect-ratio:1/1;margin:0 auto 16px}.product-image img{inset:10px;width:calc(100% - 20px);height:calc(100% - 20px)}.facts-wrap{max-width:420px;margin:0 auto}
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="toolbar">
      <div class="summary"><button class="metric filter" id="selectionFilter" type="button">MY SELECTION <span class="metric-value"><b id="selectionCount">0</b><em>/</em><b id="selectionLimit">100</b></span></button><button class="metric filter" id="foodSelectionFilter" type="button">FOOD <b id="foodSelectionCount">0</b></button><button class="metric filter" id="nonFoodSelectionFilter" type="button">NON-FOOD <b id="nonFoodSelectionCount">0</b></button><span class="allowance" id="selectionAllowance">Your account allows up to 100 selected SKUs.</span></div>
      <div class="tools"><div class="kbd"><span>↑</span><span>↓</span> Browse products</div></div>
    </header>
    <section class="workspace">
      <section class="list-panel" aria-label="Catalogue products">
        <div class="columns"><span>Image</span><span>Item Name / Packing Size</span><span>Barcode</span><span>Status</span></div>
        <div class="rows" id="rows" tabindex="0"></div>
      </section>
      <aside class="detail" id="detailPanel" aria-label="Selected product details">
        <button class="detail-close" id="closeDetail" type="button" aria-label="Close product details">×</button>
        <div class="detail-head"><div class="detail-title"><h2 id="detailName">Select a product</h2><p class="principle" id="detailPrinciple">Product information will appear here.</p></div><button class="primary" id="selectButton" type="button" disabled>Add to My Selection</button></div>
        <div class="detail-scroll">
          <div class="product-image" id="productImage"><span class="fallback">Select a product</span></div>
          <div class="facts-wrap"><div class="facts"><div class="fact"><label>Packing Size</label><span id="detailPack">—</span></div><div class="fact"><label>EA / CTN</label><span id="detailEa">—</span></div><div class="fact"><label>Unit Barcode</label><span id="detailBarcode">—</span></div><div class="fact" id="detailInnerFact" hidden><label class="title-case">Inner Box Barcode</label><span id="detailInnerBarcode">—</span></div><div class="fact"><label>Carton Barcode</label><span id="detailCartonBarcode">—</span></div><div class="fact"><label>CBM / CTN</label><span id="detailCbm">—</span></div><div class="fact"><label class="title-case">Made In</label><span id="detailOrigin">—</span></div><div class="fact"><label>Shelf Life</label><span id="detailShelf">—</span></div></div>
          <div class="price"><div class="price-label">Indicative unit price</div><div class="price-main"><strong id="detailPrice">QUOTE REQUIRED</strong><span id="priceUnit"></span></div><div class="price-note" id="priceNote">Add this item to My Selection for a confirmed quotation.</div></div></div>
        </div>
      </aside>
    </section>
  </main>
  <script>
    const state={products:[],selectedIds:new Set(),activeId:'',query:'',main:'',subIds:[],principle:'',selectionView:'',selectionLimit:100,selectionTotal:0,busyId:'',buyerRoomUrl:''};
    let renderLimit=120;
    const rows=document.getElementById('rows');
    const post=(type,payload={})=>parent.postMessage({type,...payload},'*');
    const text=v=>String(v??'').trim();
    const esc=v=>text(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const selected=p=>state.selectedIds.has(text(p.id));
    const isFood=p=>['FOOD','FOOD & BEVERAGES'].includes(text(p.mainCategory).toUpperCase());
    function filtered(){const q=state.query.toLowerCase();return state.products.filter(p=>{
      if(state.selectionView){if(!selected(p))return false;if(state.selectionView==='FOOD'&&!isFood(p))return false;if(state.selectionView==='NON_FOOD'&&isFood(p))return false;return true}
      if(state.main&&text(p.mainCategory).toUpperCase()!==state.main)return false;
      if(state.subIds.length&&!state.subIds.some(id=>(p.subCategoryIds||[]).includes(id)))return false;
      if(state.principle&&text(p.principle)!==state.principle)return false;
      if(q&&!`${p.name} ${p.description} ${p.barcode} ${p.principle}`.toLowerCase().includes(q))return false;
      return true})}
    function imageMarkup(p,large=false){return p.image?`<img src="${esc(p.image)}" alt="">`:`<span class="fallback">${large?'IMAGE PENDING':'NO IMAGE'}</span>`}
    function render(preserveScroll=false){const scrollTop=rows.scrollTop,allItems=filtered(),items=allItems.slice(0,renderLimit),selectedProducts=state.products.filter(p=>state.selectedIds.has(text(p.id))),foodCount=selectedProducts.filter(isFood).length,selectedTotal=Number.isFinite(state.selectionTotal)?state.selectionTotal:state.selectedIds.size,nonFoodCount=Math.max(0,state.selectedIds.size-foodCount);document.getElementById('selectionCount').textContent=selectedTotal;document.getElementById('selectionLimit').textContent=state.selectionLimit;document.getElementById('foodSelectionCount').textContent=foodCount;document.getElementById('nonFoodSelectionCount').textContent=nonFoodCount;document.getElementById('selectionAllowance').textContent=`Your account allows up to ${state.selectionLimit} selected SKUs.`;document.getElementById('selectionFilter').classList.toggle('active',state.selectionView==='ALL');document.getElementById('foodSelectionFilter').classList.toggle('active',state.selectionView==='FOOD');document.getElementById('nonFoodSelectionFilter').classList.toggle('active',state.selectionView==='NON_FOOD');
      if(!allItems.length){rows.innerHTML='<div class="empty">No products match the current filter.</div>';showDetail(null);return}
      if(!allItems.some(p=>p.id===state.activeId))state.activeId=allItems[0].id;
      rows.replaceChildren(...items.map(p=>{const b=document.createElement('button');b.type='button';b.className='row'+(p.id===state.activeId?' active':'');b.dataset.id=p.id;b.innerHTML=`<span class="thumb">${imageMarkup(p)}</span><span class="product"><span class="name">${esc(p.name)||'Unnamed product'}</span><span class="pack">${esc(p.description)||'Packing size pending'}</span></span><span class="barcode">${esc(p.barcode)||'—'}</span><span class="state"><span class="pill ${selected(p)?'selected':''}">${selected(p)?'Selected':'Available'}</span></span>`;b.onclick=()=>{activate(p.id,true);if(matchMedia('(max-width:900px)').matches)document.getElementById('detailPanel').classList.add('mobile-open')};return b}));
      if(preserveScroll)rows.scrollTop=scrollTop;showDetail(allItems.find(p=>p.id===state.activeId)||allItems[0]);}
    function activate(id,scroll){const items=filtered(),index=items.findIndex(p=>p.id===id);if(index>=renderLimit)renderLimit=index+40;state.activeId=id;render();if(scroll){const row=rows.querySelector(`[data-id="${CSS.escape(id)}"]`);if(row){const rowBox=row.getBoundingClientRect(),listBox=rows.getBoundingClientRect();if(rowBox.top<listBox.top)rows.scrollTop-=listBox.top-rowBox.top;else if(rowBox.bottom>listBox.bottom)rows.scrollTop+=rowBox.bottom-listBox.bottom}}}
    function showDetail(p){const button=document.getElementById('selectButton'),innerFact=document.getElementById('detailInnerFact');if(!p){innerFact.hidden=true;document.getElementById('productImage').innerHTML='<span class="fallback">Select a product</span>';document.getElementById('detailName').textContent='Select a product';document.getElementById('detailPrinciple').textContent='Product information will appear here.';['detailPack','detailEa','detailBarcode','detailInnerBarcode','detailCartonBarcode','detailCbm','detailOrigin','detailShelf'].forEach(id=>document.getElementById(id).textContent='—');document.getElementById('detailPrice').textContent='QUOTE REQUIRED';document.getElementById('priceUnit').textContent='';button.disabled=true;return}
      const innerBarcode=text(p.innerBoxBarcode);innerFact.hidden=!innerBarcode;document.getElementById('productImage').innerHTML=imageMarkup(p,true);document.getElementById('detailName').textContent=text(p.name)||'Unnamed product';document.getElementById('detailPrinciple').textContent=text(p.principle)||'FMCG MALAYSIA';document.getElementById('detailPack').textContent=text(p.description)||'—';document.getElementById('detailEa').textContent=text(p.ea)||'—';document.getElementById('detailBarcode').textContent=text(p.barcode)||'—';document.getElementById('detailInnerBarcode').textContent=innerBarcode||'—';document.getElementById('detailCartonBarcode').textContent=text(p.cartonBarcode)||'—';document.getElementById('detailCbm').textContent=text(p.cbmPerCtn)||'—';document.getElementById('detailOrigin').textContent=text(p.countryOrigin)||'—';document.getElementById('detailShelf').textContent=text(p.shelfLife)||'—';
      const price=Number(p.unitPrice);document.getElementById('detailPrice').textContent=Number.isFinite(price)&&price>0?`${text(p.currency)||'USD'} ${price.toFixed(2)}`:'QUOTE REQUIRED';document.getElementById('priceUnit').textContent=Number.isFinite(price)&&price>0?'/ PC':'';document.getElementById('priceNote').textContent=Number.isFinite(price)&&price>0?'Final price is confirmed in Buyer Room.':'Add this item to My Selection for a confirmed quotation.';
      const isBusy=state.busyId===p.id,isSelected=selected(p);button.disabled=isBusy||isSelected;button.classList.toggle('selected',isSelected);button.textContent=isBusy?'Adding…':isSelected?'✓ Selected':'Add to My Selection';button.onclick=()=>{if(!isSelected)selectProduct(p.id)}}
    function selectProduct(productId){if(state.busyId)return;state.busyId=productId;showDetail(state.products.find(p=>p.id===productId));post('catalogueWorkspaceSelect',{productId})}
    function move(step){const items=filtered();if(!items.length)return;const i=Math.max(0,items.findIndex(p=>p.id===state.activeId));activate(items[Math.max(0,Math.min(items.length-1,i+step))].id,true)}
    rows.addEventListener('scroll',()=>{const items=filtered();if(rows.scrollTop+rows.clientHeight>=rows.scrollHeight-160&&renderLimit<items.length){renderLimit=Math.min(items.length,renderLimit+120);render(true)}});
    document.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();e.stopPropagation();move(e.key==='ArrowDown'?1:-1);post('catalogueWorkspaceNavigate')}});
    function setSelectionView(view){state.selectionView=state.selectionView===view?'':view;renderLimit=120;render()}
    document.getElementById('selectionFilter').onclick=()=>setSelectionView('ALL');document.getElementById('foodSelectionFilter').onclick=()=>setSelectionView('FOOD');document.getElementById('nonFoodSelectionFilter').onclick=()=>setSelectionView('NON_FOOD');document.getElementById('closeDetail').onclick=()=>document.getElementById('detailPanel').classList.remove('mobile-open');
    window.addEventListener('message',e=>{const d=e.data||{};
      if(d.type==='catalogueWorkspaceData'){state.products=Array.isArray(d.products)?d.products:[];state.selectedIds=new Set((d.selectedProductIds||[]).map(text));state.selectionLimit=Number(d.selectionLimit)||100;state.selectionTotal=Number.isFinite(Number(d.selectionTotal))?Number(d.selectionTotal):state.selectedIds.size;state.buyerRoomUrl=text(d.buyerRoomUrl);render()}
      if(d.type==='catalogueWorkspaceSelection'){state.busyId='';if(d.ok&&d.productId){state.selectedIds.add(text(d.productId));state.selectionTotal+=1}render()}
      if(d.type==='catalogueWorkspaceFilter'){state.query=text(d.query);state.main=text(d.main).toUpperCase();state.subIds=Array.isArray(d.subIds)?d.subIds.map(text):[];state.principle=text(d.principle);state.selectionView='';renderLimit=120;render()}
