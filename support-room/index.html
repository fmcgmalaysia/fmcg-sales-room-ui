<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="build" content="2026-10-20-split-controls-v1"><title>Support Department</title><link rel="stylesheet" href="../account-room/style.css?v=20261018-fixed-header-v1"><link rel="stylesheet" href="../master-shared/task-signals.css?v=20261018-fixed-header-v1"><link rel="stylesheet" href="style.css?v=20261018-fixed-header-v1"><link rel="stylesheet" href="../master-shared/workroom-theme.css?v=20261018-fixed-header-v1"><script defer src="../master-shared/fixed-header.js?v=20261018-fixed-header-v1"></script><link rel="stylesheet" href="../master-shared/task-chat.css?v=20261020-sales-messages-v1"><link rel="stylesheet" href="../master-shared/action-affordances.css?v=20261020-action-affordances-v1"></head><body><header class="department-header"><strong class="master-brand">MASTER</strong><label><span class="company-label">Company 公司</span><select id="company" aria-label="Company 公司"><option value="NCT">North Cape Trading · NCT</option><option value="GHR">Global HR · GHR</option></select></label><strong class="department-name">Support Department <small lang="zh-CN">支持部</small></strong><span id="staff" class="staff"></span></header><nav><button data-view="active" class="active">Sales Invoicing 销售开票</button><button data-view="history">Invoice History 发票历史</button></nav><main><div class="title-row"><h1>Sales Invoicing 销售开票</h1><div><button id="login">Sign in 登入</button><button id="refresh">Refresh 刷新</button></div></div><p id="notice" class="account-notice" role="status"></p><div class="filters"><select id="customer"><option value="">All Customers 全部客户</option></select><input id="search" placeholder="Invoice / customer / barcode · 搜索" aria-label="Search"></div><div id="rows"></div></main><dialog id="invoice"><div class="dialog-header"><div><h2>Sales Invoice 销售发票</h2><strong id="invoiceCustomer"></strong></div><button id="closeInvoice">×</button
