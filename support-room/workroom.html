<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="build" content="20261027-support-workroom-candidate-v1"><title>Support Department</title><link rel="stylesheet" href="draft.css?v=20261021-support-preview-v1"><link rel="stylesheet" href="draft-compact.css?v=20261021-support-preview-v1"><link rel="stylesheet" href="workroom.css?v=20261027-support-workroom-candidate-v1"></head>
<body><header><strong class="brand">MASTER</strong><span class="department">Support Department</span><select id="company" aria-label="Company"><option value="NCT">North Cape Trading · NCT</option><option value="GHR">Global HR · GHR</option></select><b id="staff"></b><button id="refresh">Refresh</button></header>
<nav><button data-view="orders" class="active">Orders &amp; Shipments</button><button data-view="customers">Customers</button><a id="packing" href="packing-workbench.html?v=20261021-packing-v1&amp;live=1&amp;department=SUPPORT">Packing Lists ↗</a></nav>
<main><div class="heading"><div><h1 id="title">Orders &amp; Shipments</h1><p id="company-name">North Cape Trading Sdn. Bhd.</p></div><button id="back" hidden>← Back</button></div>
<div class="guide" id="guide"><b>Document Guide</b><div id="guide-items"></div></div>
<div id="summary" class="summary" hidden></div><div id="subnav" class="subnav" hidden></div>
<div class="tools"><select id="customer-filter" aria-label="Customer"><option value="">All Customers</option></select><input id="search" type="search" placeholder="Search customer, order or invoice"><span id="count"></span></div>
<div id="content" class="table-frame"></div><p id="notice" class="notice" role="status">Loading customer orders…</p><button id="login" hidden>Sign in</button></main>
<dialog id="information"><div class="dialog-header"><h2 id="information-title"></h2><button data-close="information" class="x" aria-label="Close">×</button></div><div class="dialog-body" id="information-body"></div><footer><button data-close="information">Close</button></footer></dialog>
<dialog id="booking"><div class="dialog-header"><h2>Shipment Details</h2><button data-close="booking" class="x" aria-label="Close">×</button></div><form id="booking-form"><div class="dialog-body"><p id="booking-order"></p><fieldset id="booking-fields"><legend>Transport</legend><label><input type="radio" name="transport" value="LAND" required> LAND</label><label><input type="radio" name="transport" value="SEA_20FT"> SEA 20FT</label><label><input type="radio" name="transport" value="SEA_40FT"> SEA 40FT</label><label class="date-label">Shipment Date<input id="booking-date" type="date" required min="1000-01-01" max="9999-12-31"></label></fieldset><p id="booking-status" role="status"></p></div><footer><button type="button" data-close="booking">Cancel</button><button id="booking-save" class="primary" type="submit">Save</button></footer></form></dialog>
<script src="workroom-model.js?v=20261027-support-workroom-candidate-v1"></script><script src="workroom.js?v=20261027-support-workroom-candidate-v1"></script></body></html>
