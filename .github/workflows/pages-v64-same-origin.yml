      - name: Prepare scoped PO revision and shared status resources
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'po-revision-only'
        run: node integration/prototypes/po-revision-ui-20261030/stage-state-colors.cjs "$RUNNER_TEMP/po-revision-site"

      - name: Upload scoped PO revision resources only
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'po-revision-only'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ format('{0}/po-revision-site', runner.temp) }}

      - name: Prepare scoped Purchase and Finance document colors
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'docs-state-colors-only'
        run: node integration/prototypes/docs-state-colors-20261030/stage.cjs "$RUNNER_TEMP/docs-state-colors-site"

      - name: Upload scoped document color resources only
