        with:
          path: ${{ format('{0}/purchase-source-receipt-site', runner.temp) }}

      - name: Prepare Purchase Active clarity presentation only
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'purchase-active-clarity-only'
        run: node integration/prototypes/purchase-active-clarity-20261031/stage.cjs "$RUNNER_TEMP/purchase-active-clarity-site"

      - name: Upload Purchase Active clarity resources only
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'purchase-active-clarity-only'
