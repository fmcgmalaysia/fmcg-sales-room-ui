      - name: Prepare scoped Purchase ready-stock source resources
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'purchase-ready-stock-only'
        run: node integration/prototypes/purchase-ready-stock-20261031/stage.cjs "$RUNNER_TEMP/purchase-ready-stock-site"

      - name: Upload scoped Purchase ready-stock source resources
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'purchase-ready-stock-only'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ format('{0}/purchase-ready-stock-site', runner.temp) }}

      - name: Prepare scoped company Stock List resources
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'company-stock-list-only'
        run: node integration/prototypes/company-stock-list-20261031/stage.cjs "$RUNNER_TEMP/company-stock-list-site"

      - name: Upload scoped company Stock List resources
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'company-stock-list-only'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ format('{0}/company-stock-list-site', runner.temp) }}

      - name: Prepare Stock List Purchase presentation only
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'stock-list-style-only'
        run: node integration/prototypes/stock-list-purchase-style-20261031/stage.cjs "$RUNNER_TEMP/stock-list-style-site"

      - name: Upload Stock List presentation resources only
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'stock-list-style-only'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ format('{0}/stock-list-style-site', runner.temp) }}

      - name: Prepare Purchase stock actions on the current public baseline
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'purchase-stock-actions-only'
        run: node integration/prototypes/purchase-stock-actions-20261031/stage.cjs "$RUNNER_TEMP/purchase-stock-actions-site"

      - name: Upload Purchase stock actions resources only
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'purchase-stock-actions-only'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ format('{0}/purchase-stock-actions-site', runner.temp) }}

      - name: Prepare ALLOC dialog presentation only
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'purchase-alloc-layout-only'
        run: node integration/prototypes/purchase-alloc-layout-20261031/stage.cjs "$RUNNER_TEMP/purchase-alloc-layout-site"

      - name: Upload ALLOC dialog presentation resources only
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'purchase-alloc-layout-only'
