        run: node integration/prototypes/purchase-allocation-20261029/stage.cjs "$RUNNER_TEMP/purchase-allocation-site"

      - name: Upload customer allocation static resources only
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'purchase-allocation-only'
        uses: actions/upload-pages-artifact@v5
        with:
