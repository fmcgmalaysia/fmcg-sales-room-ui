      - name: Prepare quiet Purchase background refresh on the pinned current baseline
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'purchase-quiet-refresh-only'
        run: node integration/prototypes/purchase-quiet-refresh-20261029/stage.cjs "$RUNNER_TEMP/purchase-quiet-refresh-site"

      - name: Upload quiet Purchase refresh resources only
