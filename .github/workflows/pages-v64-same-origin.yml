      - name: Prepare confirmed Purchase save feedback only
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'purchase-confirmed-feedback-only'
        run: node integration/prototypes/purchase-confirmed-feedback-20261030/stage.cjs "$RUNNER_TEMP/purchase-confirmed-feedback-site"

      - name: Upload confirmed Purchase save feedback resources only
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'purchase-confirmed-feedback-only'
        uses: actions/upload-pages-artifact@v5
        with:
