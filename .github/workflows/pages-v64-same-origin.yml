ile-tablet-workrooms-only' && inputs.static_ui != 'support-autocount-si-only' && inputs.static_ui != 'purchase-supplier-inquiry-only' && inputs.static_ui != 'master-dialog-headers-only' && inputs.static_ui != 'master-dialog-coverage-only' && inputs.static_ui != 'purchase-supplier-po-alignment-only' && inputs.static_ui != 'task-tables-standard-only' && inputs.static_ui != 'warehouse-image-hover-only'
