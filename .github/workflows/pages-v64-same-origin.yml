        # The company-stock-list release uses the isolated asset upload below.
        if: inputs.static_ui != 'customer-name-order-only' && inputs.static_ui != 'purchase-shortfall-refresh-only' && inputs.static_ui != 'purchase-receipt-compact-only' && inputs.static_ui != 'buyer-multi-company-only' && inputs.static_ui != 'purchase-split-surplus-only' && inputs.static_ui != 'buyer-waiting-campaign-only' && inputs.static_ui != 'buyer-catalogue-mobile-only' && inputs.static_ui != 'catalogue-mobile-columns-only' && inputs.static_ui != 'buyer-room-polish-only' && inputs.static_ui != 'buyer-first-time-login-only' && inputs.static_ui != 'sales-mobile-buyer-entry-only' && inputs.static_ui != 'sales-workspace-entry-cleanup-only' && inputs.static_ui != 'catalogue-buyer-mobile-layout-only' && inputs.static_ui != 'buyer-mobile-prepare-order-only' && inputs.static_ui != 'buyer-room-full-html-login-only' && inputs.static_ui != 'buyer-quotations-selection-only' && inputs.static_ui != 'support-create-cipl-only' && inputs.static_ui != 'shortfall-dispatch-confirmation-only' && inputs.static_ui != 'purchase-support-shortfall-only' && inputs.static_ui != 'quotation-buyer-followup-only' && inputs.static_ui != 'catalogue-complete-only' && inputs.static_ui != 'master-department-brand-only' && inputs.static_ui != 'ltpos-custom-domain-only' && inputs.static_ui != 'sales-qd-retirement-only' && inputs.static_ui != 'web-quotations-only' && inputs.static_ui != 'sales-customer-ltpos-routing-only' && inputs.static_ui != 'sales-staff-menu-retirement-only' && inputs.static_ui != 'purchase-supplier-profile-fields-only' && inputs.static_ui != 'isolated-stock-interface' && inputs.static_ui != 'purchase-layout-only' && inputs.static_ui != 'receipt-feedback-only' && inputs.static_ui != 'support-workroom-only' && inputs.static_ui != 'master-efficiency-only' && inputs.static_ui != 'master-save-continuity-only' && inputs.static_ui != 'stock-loaded-only' && inputs.static_ui != 'desk-delivery-only' && inputs.static_ui != 'support-details-only' && inputs.static_ui != 'purchase-allocation-only' && inputs.static_ui != 'purchase-quiet-refresh-only' && inputs.static_ui != 'purchase-active-only' && inputs.static_ui != 'purchase-confirmed-feedback-only' && inputs.static_ui != 'po-revision-only' && inputs.static_ui != 'docs-state-colors-only' && inputs.static_ui != 'purchase-personal-row-order-only' && inputs.static_ui != 'purchase-received-review-only' && inputs.static_ui != 'support-shortload-only' && inputs.static_ui != 'purchase-ready-stock-only' && inputs.static_ui != 'company-stock-list-only' && inputs.static_ui != 'stock-list-style-only' && inputs.static_ui != 'purchase-stock-actions-only' && inputs.static_ui != 'purchase-alloc-layout-only' && inputs.static_ui != 'purchase-source-receipt-only' && inputs.static_ui != 'purchase-active-clarity-only' && inputs.static_ui != 'purchase-receipt-info-only' && inputs.static_ui != 'purchase-etd-requested-only' && inputs.static_ui != 'purchase-quiet-quantities-only' && inputs.static_ui != 'purchase-payment-message-only' && inputs.static_ui != 'purchase-quantity-style-only' && inputs.static_ui != 'warehouse-effective-quantity-only' && inputs.static_ui != 'warehouse-operational-header-only' && inputs.static_ui != 'master-closeout-display-only' && inputs.static_ui != 'purchase-origin-view-source-only' && inputs.static_ui != 'purchase-read-efficiency-only' && inputs.static_ui != 'month-end-stock-loss-only' && inputs.static_ui != 'purchase-locked-dialog-only' && inputs.static_ui != 'finance-payable-confirmation-only' && inputs.static_ui != 'po-auto-allocation-only' && inputs.static_ui != 'customer-loaded-records-only' && inputs.static_ui != 'customer-invoice-payments-only' && inputs.static_ui != 'sales-department-only' && inputs.static_ui != 'two-site-closeout-only' && inputs.static_ui != 'customer-site-isolation-only' && inputs.static_ui != 'purchase-compact-tasks-only' && inputs.static_ui != 'buyer-cbm-display-only' && inputs.static_ui != 'purchase-merge-po-entry-only' && inputs.static_ui != 'warehouse-desk-rout