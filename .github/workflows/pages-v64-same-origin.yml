      - name: Prepare personal Purchase row order only
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'purchase-personal-row-order-only'
        run: node integration/prototypes/purchase-personal-row-order-20261030/stage.cjs "$RUNNER_TEMP/purchase-personal-row-order-site"

      - name: Upload personal Purchase row order resources only
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'purchase-personal-row-order-only'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ format('{0}/purchase-personal-row-order-site', runner.temp) }}

      - name: Prepare received-review resources (no backend or private evidence)
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'purchase-received-review-only'
        run: node integration/prototypes/purchase-received-review-20261031/stage.cjs "$RUNNER_TEMP/purchase-received-review-site"

      - name: Upload received-review resources
