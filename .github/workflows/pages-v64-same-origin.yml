permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-v64-same-origin
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Prepare paired stock interface resources
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'stock-interface'
        run: node integration/prototypes/stock-current-state/stage-business-ui-install.cjs "$RUNNER_TEMP/stock-interface-site"

