-allocation-only' && inputs.static_ui != 'customer-loaded-records-only' && inputs.static_ui != 'customer-invoice-payments-only' && inputs.static_ui != 'sales-department-only' && inputs.static_ui != 'two-site-closeout-only' && inputs.static_ui != 'customer-site-isolation-only' && inputs.static_ui != 'purchase-compact-tasks-only' && inputs.static_ui != 'buyer-cbm-display-only' && inputs.static_ui != 'purchase-merge-po-entry-only' && inputs.static_ui != 'warehouse-desk-route-only' && inputs.static_ui != 'master-stress-closeout-only' && inputs.static_ui != 'purchase-clean-dialog-close-only' && inputs.static_ui != 'support-reusable-desk-only' && inputs.static_ui != 'warehouse-read-recovery-only' && inputs.static_ui != 'support-invoice-desk-refresh-only' && inputs.static_ui != 'customer-file-parent-open-only' && inputs.static_ui != 'buyer-entry-parent-only' && inputs.static_ui != 'purchase-save-consistency-only' && inputs.static_ui != 'sales-customer-selected-only' && inputs.static_ui != 'buyer-quantity-efficiency-only' && inputs.static_ui != 'sales-selection-layout-only' && inputs.static_ui != 'buyer-order-success-only' && inputs.static_ui != 'sales-streamline-only' && inputs.static_ui != 'sales-date-segments-only' && inputs.static_ui != 'support-original-upload-recovery-only' && inputs.static_ui != 'sales-compact-invoice-history-only' && inputs.static_ui != 'customer-track-evidence-only' && inputs.static_ui != 'buyer-committed-quantity-only' && inputs.static_ui != 'support-transaction-context-only' && inputs.static_ui != 'sales-native-buyer-entry-only' && inputs.static_ui != 'sales-buyer-current-tab-only' && inputs.static_ui != 'sales-quantity-save-only' && inputs.static_ui != 'supplier-dialog-image-only' && inputs.static_ui != 'purchase-receipt-ux-only' && inputs.static_ui != 'purchase-waiting-borrow-only' && inputs.static_ui != 'purchase-quantity-save-only' && inputs.static_ui != 'purchase-urgent-task-layout-only' && inputs.static_ui != 'purchase-workflow-polish-only'