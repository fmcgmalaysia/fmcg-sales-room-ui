name: Deploy Buyer Room v64 to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      static_ui:
        description: Static interface installation only; does not activate current-stock writes
        type: choice
        default: baseline
        options:
          - baseline
          - stock-interface
          - isolated-stock-interface
          - purchase-layout-only
          - receipt-feedback-only
          - support-workroom-only
          - master-efficiency-only
          - master-save-continuity-only
          - stock-loaded-only
          - desk-delivery-only
          - support-details-only
          - purchase-allocation-only
          - purchase-quiet-refresh-only
          - purchase-active-only
          - purchase-confirmed-feedback-only
          - po-revision-only
          - docs-state-colors-only
          - purchase-personal-row-order-only
          - purchase-received-review-only
          - support-shortload-only
          - purchase-ready-stock-only
          - company-stock-list-only
          - stock-list-style-only
          - purchase-stock-actions-only
          - purchase-alloc-layout-only
          - purchase-source-receipt-only
          - purchase-active-clarity-only
          - purchase-receipt-info-only
          - purchase-etd-requested-only
          - purchase-quiet-quantities-only
          - purchase-payment-message-only

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-v64-same-origin
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Prepare paired stock interface resources
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'stock-interface'
        run: node integration/prototypes/stock-current-state/stage-business-ui-install.cjs "$RUNNER_TEMP/stock-interface-site"

      - name: Upload static site
        # The company-stock-list release uses the isolated asset upload below.
        if: inputs.static_ui != 'isolated-stock-interface' && inputs.static_ui != 'purchase-layout-only' && inputs.static_ui != 'receipt-feedback-only' && inputs.static_ui != 'support-workroom-only' && inputs.static_ui != 'master-efficiency-only' && inputs.static_ui != 'master-save-continuity-only' && inputs.static_ui != 'stock-loaded-only' && inputs.static_ui != 'desk-delivery-only' && inputs.static_ui != 'support-details-only' && inputs.static_ui != 'purchase-allocation-only' && inputs.static_ui != 'purchase-quiet-refresh-only' && inputs.static_ui != 'purchase-active-only' && inputs.static_ui != 'purchase-confirmed-feedback-only' && inputs.static_ui != 'po-revision-only' && inputs.static_ui != 'docs-state-colors-only' && inputs.static_ui != 'purchase-personal-row-order-only' && inputs.static_ui != 'purchase-received-review-only' && inputs.static_ui != 'support-shortload-only' && inputs.static_ui != 'purchase-ready-stock-only' && inputs.static_ui != 'company-stock-list-only' && inputs.static_ui != 'stock-list-style-only' && inputs.static_ui != 'purchase-stock-actions-only' && inputs.static_ui != 'purchase-alloc-layout-only' && inputs.static_ui != 'purchase-source-receipt-only' && inputs.static_ui != 'purchase-active-clarity-only' && inputs.static_ui != 'purchase-receipt-info-only' && inputs.static_ui != 'purchase-etd-requested-only' && inputs.static_ui != 'purchase-quiet-quantities-only' && inputs.static_ui != 'purchase-payment-message-only'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ inputs.static_ui == 'stock-interface' && format('{0}/stock-interface-site', runner.temp) || '.' }}

      - name: Prepare isolated static resources (no backend or private evidence)
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'isolated-stock-interface'
        run: node integration/prototypes/stock-current-state/stage-isolated-cohort.cjs "$RUNNER_TEMP/isolated-stock-interface-site"

      - name: Upload isolated static site
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'isolated-stock-interface'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ format('{0}/isolated-stock-interface-site', runner.temp) }}

      - name: Prepare approved Purchase layout on current live static baseline
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'purchase-layout-only'
        run: node integration/prototypes/purchase-active-layout-20261025/stage.cjs "$RUNNER_TEMP/purchase-layout-site"

      - name: Upload approved Purchase layout only
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'purchase-layout-only'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ format('{0}/purchase-layout-site', runner.temp) }}

      - name: Prepare scoped receipt feedback on the approved live baseline
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'receipt-feedback-only'
        run: node integration/prototypes/receipt-feedback-20261026/stage.cjs "$RUNNER_TEMP/receipt-feedback-site"

      - name: Upload scoped receipt feedback resources only
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'receipt-feedback-only'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ format('{0}/receipt-feedback-site', runner.temp) }}

      - name: Prepare scoped Support workroom on the current public baseline
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'support-workroom-only'
        run: node integration/prototypes/support-workroom-20261027/stage.cjs "$RUNNER_TEMP/support-workroom-site"

      - name: Upload scoped Support workroom resources only
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'support-workroom-only'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ format('{0}/support-workroom-site', runner.temp) }}

      - name: Prepare scoped MASTER efficiency changes on the verified public baseline
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'master-efficiency-only'
        run: node integration/prototypes/master-efficiency-20261028/stage.cjs "$RUNNER_TEMP/master-efficiency-site"

      - name: Upload scoped MASTER efficiency resources only
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'master-efficiency-only'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ format('{0}/master-efficiency-site', runner.temp) }}

      - name: Prepare scoped MASTER save continuity on the current public baseline
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'master-save-continuity-only'
        run: node integration/prototypes/master-save-continuity-20261028/stage.cjs "$RUNNER_TEMP/master-save-continuity-site"

      - name: Upload scoped MASTER save continuity resources only
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'master-save-continuity-only'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ format('{0}/master-save-continuity-site', runner.temp) }}

      - name: Prepare scoped Loaded stock resources on the current public baseline
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'stock-loaded-only'
        run: node integration/prototypes/stock-loaded-contract-20261028/stage.cjs "$RUNNER_TEMP/stock-loaded-site"

      - name: Upload scoped Loaded stock resources only
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'stock-loaded-only'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ format('{0}/stock-loaded-site', runner.temp) }}

      - name: Prepare Desk-authorized delivery resources on frozen v2
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'desk-delivery-only'
        run: node integration/prototypes/desk-delivery-task-20261029/stage.cjs "$RUNNER_TEMP/desk-delivery-site"

      - name: Upload Desk-authorized delivery resources only
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'desk-delivery-only'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ format('{0}/desk-delivery-site', runner.temp) }}

      - name: Prepare compact Support details and operational Warehouse task resources
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'support-details-only'
        run: node integration/prototypes/support-details-20261029/stage.cjs "$RUNNER_TEMP/support-details-site"

      - name: Upload scoped Support details resources only
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'support-details-only'
