          - sales-department-only
          - two-site-closeout-only
          - customer-site-isolation-only
          - purchase-compact-tasks-only
          - buyer-cbm-display-only
          - purchase-merge-po-entry-only
          - warehouse-desk-route-only
          - master-stress-closeout-only
          - purchase-clean-dialog-close-only
          - support-reusable-desk-only
          - warehouse-read-recovery-only
          - support-invoice-desk-refresh-only
          - customer-file-parent-open-only
          - buyer-entry-parent-only
          - purchase-save-consistency-only
          - sales-customer-selected-only
          - buyer-quantity-efficiency-only
          - sales-selection-layout-only
          - buyer-order-success-only
          - sales-streamline-only
          - sales-date-segments-only
          - support-original-upload-recovery-only
          - sales-compact-invoice-history-only
          - customer-track-evidence-only
          - buyer-committed-quantity-only
          - support-transaction-context-only
          - sales-native-buyer-entry-only
          - sales-buyer-current-tab-only
          - sales-quantity-save-only
          - supplier-dialog-image-only
          - purchase-receipt-ux-only
          - purchase-waiting-borrow-only
          - purchase-quantity-save-only
          - purchase-urgent-task-layout-only
          - purchase-workflow-polish-only
          - warehouse-receipt-evidence-only
          - warehouse-compact-receipt-only
          - warehouse-desk-workflow-only
          - sales-confirmed-save-only
      master_staff_management:
        description: Add the approved MASTER staff pages to the Warehouse Desk package
        type: boolean
        default: false
      support_desk_label:
        description: Apply the Support Desk label to the verified staff and Warehouse Desk package
        type: boolean
        default: false
      shipment_delivery:
        description: Apply Support planning dates and Warehouse Delivery Task display
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-v64-same-origin
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Prepare paired stock interface resources
        if: github.event_name == 'workflow_dispatch' && inputs.static_ui == 'stock-interface'
        run: node integration/prototypes/stock-current-state/stage-business-ui-install.cjs "$RUNNER_TEMP/stock-interface-site"

      - name: Upload static site
