<!doctype html><html><head><meta charset="utf-8"><title>Purchase split mothers · LOCAL CANDIDATE</title><style>html,body{margin:0;height:100%;font:12px Arial}header{height:36px;padding:0 14px;display:flex;align-items:center;background:#fff0d6;color:#17314f}iframe{width:100%;height:calc(100% - 36px);border:0}</style></head><body><header>LOCAL CANDIDATE 本地样例 · Independent shipment rows · No production connection</header><iframe id="purchase" src="/purchase-live/index.html"></iframe><script>
const base={id:'T',customerId:'C',orderId:'O',barcode:'9556404007035',name:'7 UP (CAN)',packing:'320ML x 24',ea:24,ord:500,inc:0,history:[],supplierId:'S',po:'NCT-PO-SAMPLE',lpCtn:10,lpPc:10/24,disc1:0,disc2:0,disc3:0,gp:.2,sourceGp:.2,masterReceivedAt:'2026-10-20T00:00:00Z',stage:'NEW_INCOMING',editVersion:'V1',procurement:{totalCtn:500,revision:'V',customerCtn:500},warehouse:{accepted:500,hasPhysicalReceipt:true},batchEntitlements:[{id:'P|1',metrics:{committed:300,received:300},sources:[{id:'T',quantity:300}]},{id:'P|2',metrics:{committed:200,received:200},sources:[{id:'T',quantity:200}]}]};
let version=1,orderRows=['["T","P|1"]','["T","P|2"]','["B",""]'];
function sample(){return {company:'NCT',staff:{staffId:'DEMO',staffName:'LAW',memberId:'DEMO'},fetchedAt:new Date().toISOString(),sourcesVersion:'S1',customers:[{id:'C',name:'SAMPLE CUSTOMER',shortName:'SAMPLE'}],suppliers:[{id:'S',name:'SAMPLE SUPPLIER',shortName:'SAMPLE'}],tasks:[base,{...base,id:'B',name:'OTHER PRODUCT',ord:100,po:'',supplierId:'',procurement:{totalCtn:null,revision:''},warehouse:{},batchEntitlements:[]}],shipmentPlans:[{id:'P',revision:'P1',orderId:'O',customerId:'C',batches:[{sequence:1,label:'This shipment',lines:[{taskId:'T',quantity:300}]},{sequence:2,label:'Next shipment',lines:[{taskId:'T',quantity:200}]}]}],purchaseDisplayOrder:{C:{revision:'SAMPLE',version:'V'+version,rows:orderRows}}};}
addEventListener('message',async event=>{if(event.source!==document.querySelector('iframe').contentWindow)return;const m=event.data||{},send=(type,extra)=>event.source.postMessage({type,requestId:m.requestId,company:m.company,ok:true,...extra},location.origin);if(window.localPurchaseServer){const result=await window.localPurchaseServer(m);if(result)send(result.type,result.extra);return;}if(m.type==='PURCHASE_WORKSPACE_REQUEST')send('PURCHASE_WORKSPACE_RESULT',{workspace:sample()});if(m.type==='PURCHASE_ORDERS_REQUEST')send('PURCHASE_ORDERS_RESULT',{result:{company:'NCT',orders:[],paymentRequestsConnected:true}});if(m.type==='PURCHASE_SAVE_REQUEST'){if(m.input?.displayRows&&m.input.displayOrderVersion==='V'+version){orderRows=m.input.displayRows;version++;send('PURCHASE_SAVE_RESULT',{result:{ok:true,company:'NCT',requestId:m.requestId}});}else event.source.postMessage({type:'PURCHASE_SAVE_RESULT',requestId:m.requestId,company:m.company,ok:false,error:'Sample order changed; draft retained.'},location.origin);}});
</script></body></html>
