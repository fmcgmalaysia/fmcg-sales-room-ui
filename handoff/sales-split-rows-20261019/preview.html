<!doctype html><html><head><meta charset="utf-8"><title>Sales split · LOCAL CANDIDATE</title><style>html,body{margin:0;height:100%;font:12px Arial;background:#edf2f7}header{height:40px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#fff3d6}header button{padding:5px 12px;cursor:pointer}iframe{height:calc(100% - 40px);width:100%;border:0}iframe[hidden]{display:none}</style></head><body>
<header>LOCAL CANDIDATE · Sample records only <button data-room="sales">Sales</button><button data-room="buyer">Buyer Track</button><button data-room="purchase">Purchase</button><button data-room="warehouse">Warehouse</button><span id="result">500 CTN · Not split</span></header>
<iframe id="sales" src="../../index.html"></iframe><iframe id="buyer" hidden src="../../buyer-room.html"></iframe><iframe id="purchase" hidden src="../../purchase-live/index.html"></iframe><iframe id="warehouse" hidden src="../../warehouse-room/index.html"></iframe>
<script>
const customer={customerId:'SPLIT-DEMO',customerShortName:'TESTING 168',companyName:'TESTING 168',preferredCurrency:'USD',catalogueAccessStatus:'ACTIVE',customerStatus:'ACTIVE',qdStatus:'READY',activeOrderLineCount:1,selectionLimit:100,accessUserCount:1};
const line={lineId:'L1',itemId:'PRODUCT',barcode:'9556404007035',itemName:'7 UP (CAN)',packingSize:'320ML x 24',quantityCtn:500,requestedQtyCtn:500,committedQtyCtn:500,receivedQtyCtn:0,masterSubmittedAt:'2026-10-19T00:00:00Z',lockedPriceCtn:10.08,cbmPerCtn:.0118};
const order={orderId:'ORDER-SPLIT-DEMO',customerId:customer.customerId,companyName:customer.companyName,currency:'USD',status:'SUBMITTED TO NCT',destination:'NCT',masterReceipt:{submissionId:'SUB'},confirmedAt:'2026-10-19T00:00:00Z',confirmedBy:'LAW',submittedAt:'2026-10-19T00:00:00Z',lines:[line]};
const task={id:'TASK',customerId:customer.customerId,orderId:order.orderId,sourceLineId:'L1',barcode:line.barcode,name:line.itemName,packing:line.packingSize,ea:24,ord:500,inc:0,history:[],supplierId:'',po:'',costStatus:'CAPTURED',masterReceivedAt:order.confirmedAt,stage:'NEW_INCOMING',editVersion:'V1',transactionCurrency:'USD',procurement:{totalCtn:null,revision:'',draftPlan:true}};
let plan=null;const replies=new Map();
function reply(source,type,message,extra){source.postMessage({type,requestId:message.requestId,company:message.company,ok:true,...extra},location.origin);}
function workspace(){return {company:'NCT',staff:{staffId:'DEMO',memberId:'DEMO',staffName:'LAW'},fetchedAt:new Date().toISOString(),sourcesVersion:'S1',customers:[{id:customer.customerId,name:customer.companyName,shortName:customer.customerShortName}],suppliers:[],tasks:[task],shipmentPlans:plan?[plan]:[]};}
function warehouse(){const batches=plan?plan.batches:[{sequence:1,label:'',lines:[{taskId:'TASK',quantity:500}]}];return {company:'NCT',staff:{staffName:'LAW'},orders:[],readAt:new Date().toISOString(),customerLines:[{taskId:'TASK',customerId:customer.customerId,customerName:customer.companyName,requiredQty:500,allocatedQty:0}],deliveryTasks:batches.map(batch=>({id:'PACK-'+batch.sequence,taskId:'TASK',orderId:order.orderId,customerId:customer.customerId,customerName:customer.companyName,barcode:line.barcode,name:line.itemName,packing:line.packingSize,quantity:batch.lines[0].quantity,batch:batch.label,readyStock:0,allocated:0,prepared:false,loaded:0,photos:[],history:[],note:'',cbmPerCtn:.0118,status:'PENDING',version:'V1'}))};}
document.querySelectorAll('[data-room]').forEach(button=>button.onclick=()=>{document.querySelectorAll('iframe').forEach(frame=>frame.hidden=frame.id!==button.dataset.room);});
addEventListener('message',event=>{
 const m=event.data||{},frame=[...document.querySelectorAll('iframe')].find(frame=>frame.contentWindow===event.source);if(!frame)return;
 if(['SALES_ROOM_READY','SALES_ROOM_CUSTOMERS_REQUEST'].includes(m.type)){reply(event.source,'SALES_ROOM_STAFF',m,{staff:{staffId:'DEMO',staffName:'LAW',role:'ADMIN',canViewAllCustomers:true}});reply(event.source,'SALES_ROOM_CUSTOMERS',m,{customers:[customer],summary:{confirmedOrderCount:1}});}
 if(m.type==='SALES_ROOM_ORDER_PROGRESS_REQUEST')reply(event.source,'SALES_ROOM_ORDER_PROGRESS',m,{customerShortName:customer.customerShortName,currency:'USD',orders:[order]});
 if(m.type==='SALES_ROOM_CONFIRMED_ORDERS_REQUEST')reply(event.source,'SALES_ROOM_CONFIRMED_ORDERS',m,{orders:[order]});
 if(m.type==='SALES_ROOM_SHIPMENT_REQUEST'){
  if(m.action==='READ')reply(event.source,'SALES_ROOM_SHIPMENT_RESULT',m,{result:{lines:[{taskId:'TASK',orderId:order.orderId,sourceLineId:'L1',requested:500}],plans:plan?[plan]:[],planVersion:plan?'P2':'P1'}});
  else if(m.action==='PLAN'){
   if(!replies.has(m.requestId)){plan={...m.input,id:'PLAN',revision:'P2',at:new Date().toISOString(),by:'LAW',batches:m.input.batches.map((batch,index)=>({...batch,sequence:index+1}))};line.shipmentBatches=plan.batches.map(batch=>({id:'PLAN|'+batch.sequence,label:batch.label,quantity:batch.lines[0].quantity,at:plan.at,by:plan.by}));replies.set(m.requestId,true);document.querySelector('#result').textContent='Saved sample: '+line.shipmentBatches.map(batch=>batch.quantity).join(' + ');}
   reply(event.source,'SALES_ROOM_SHIPMENT_RESULT',m,{result:{ok:true}});
  }
 }
 if(['BUYER_ROOM_READY','BUYER_ROOM_REQUEST_DATA'].includes(m.type))reply(event.source,'BUYER_ROOM_DATA',m,{data:{customerId:customer.customerId,companyName:customer.companyName,memberName:'TEST BUYER',currency:'USD',selectionLimit:100,myList:[{...line,id:'PRODUCT',category:'FOOD',brandName:'7 UP',quoteStatus:'VIEW QUOTE',quoteActive:true,vipCurrency:'USD',vipPriceCtn:10.08}],removed:[],orders:[order]}});
 if(m.type==='BUYER_ROOM_ORDER_DETAIL')reply(event.source,'BUYER_ROOM_ORDER_DETAIL_RESULT',m,{customerId:customer.customerId,order});
 if(m.type==='PURCHASE_WORKSPACE_REQUEST')reply(event.source,'PURCHASE_WORKSPACE_RESULT',m,{workspace:workspace()});
 if(m.type==='PURCHASE_ORDERS_REQUEST')reply(event.source,'PURCHASE_ORDERS_RESULT',m,{result:{company:'NCT',orders:[]}});
 if(m.type==='WAREHOUSE_ORDERS_REQUEST')reply(event.source,'WAREHOUSE_ORDERS_RESULT',m,{result:warehouse()});
 if(m.type.includes('SAVE_REQUEST')&&!m.type.startsWith('SALES'))reply(event.source,m.type.replace('REQUEST','RESULT'),m,{ok:false,error:'Sample view only; no CMS connection.'});
});
</script></body></html>
