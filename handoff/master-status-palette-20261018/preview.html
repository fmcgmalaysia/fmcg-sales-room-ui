<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MASTER palette · Local candidate</title>
<style>body{margin:0;background:#f3f6f9;font:12px 'Segoe UI',Arial;color:#203047}header{padding:10px 24px;background:#fff0d6;display:flex;align-items:center;gap:24px}header small{margin-left:auto}nav{display:flex;gap:20px;padding:8px 24px;background:white}nav button{background:white;color:#3766a2;border:1px solid #bccbd9;border-radius:4px;padding:7px 14px;cursor:pointer}iframe{width:100%;height:calc(100vh - 104px);border:0}</style>
<header><b>MASTER · Colour review</b><span>LOCAL CANDIDATE · SAMPLE STATES</span><small>No production writes</small></header>
<nav><button data-room="purchase-live">Purchase</button><button data-room="account-room">Account</button><button data-room="warehouse-room">Warehouse</button><button data-room="support-room">Support</button></nav><iframe title="Department colour preview"></iframe>
<script>
const icon='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 4 4L19 6"/></svg>';
const waiting='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 18V4m-5 5 5-5 5 5M5 15v5h14v-5"/></svg>';
function render(room){
 const root='../../'+room+'/',shared='../../master-shared/';
 const css=[root+'style.css',...(room==='purchase-live'?[root+'task-grid.css',root+'dashboard.css',root+'active-orders.css']:[]),shared+'stock-exceptions.css',shared+'task-signals.css',shared+'workroom-theme.css',...(room==='account-room'?[root+'payment-layout.css']:[])];
 const shell='<header class="department-header"><strong class="master-brand">MASTER</strong><strong class="department-name">'+({ 'purchase-live':'Purchase Department','account-room':'Account Department','warehouse-room':'Warehouse Department','support-room':'Support Department'}[room])+'</strong></header>';
 const purchase='<section class="active-order-heading"><h1>Active Orders 采购任务</h1></section><div class="ao-priorities"><button class="ao-priority pending has-work">Pending P.O.<b>2</b></button><button class="ao-priority incoming has-work">Incoming Alert<b>1</b></button></div><table class="active-order-table"><thead><tr><th>Description</th><th>Supplier</th><th>Our P.O.</th></tr></thead><tbody id="taskRows"><tr><td>SAMPLE PRODUCT <span class="gp gp-good gp-badge">12.00%</span></td><td><span class="supplier-head complete">● Confirmed supplier</span></td><td><button class="po-reference complete">NCT-PO-EXAMPLE</button></td></tr><tr><td>Sub-row <span class="gp gp-good gp-badge">12.00%</span></td><td><span class="supplier-head pending">● Pending supplier</span></td><td><button class="po-reference pending">P.O.</button></td></tr><tr><td>NEGATIVE GP <span class="gp gp-low gp-badge">−0.14%</span></td><td colspan="2">Issue requires resolution</td></tr></tbody></table><h2>Documents &amp; payment</h2><div class="po-submission-workspace"><div class="po-doc-badges"><button class="po-doc-badge available">PO</button><button class="po-doc-badge available">PI</button><button class="po-doc-badge pending">DO</button><button class="po-doc-badge problem">INV</button><button class="po-request-payment submitted">'+icon+'</button><button class="po-request-payment">'+waiting+'</button></div></div><section class="payment-workspace"><h2>Payment Follow-up</h2><div class="pf-priorities"><button class="pf-priority pending">Awaiting Review<b>2</b></button><button class="pf-priority problem">Action Required<b>1</b></button><button class="pf-priority complete">Payment Updates<b>1</b></button></div><button class="pf-status waiting">Waiting for Acc. response</button> <button class="pf-status pending">Partially Paid</button> <button class="pf-status complete">Fully Paid</button></section>';
 const account='<div class="acc-title"><div><h1>Payment Plan</h1><p>North Cape Trading Sdn. Bhd.</p></div></div><div class="acc-funding"><section class="orange"><small>Payment requests MYR</small><b>4,300.00</b></section><section><small>Available cash</small><b>Not set</b></section><section><small>Available facilities</small><b>Not set</b></section><section><small>Funding gap</small><b>Not set</b></section></div><section class="account-purchases acc-plan"><table><thead><tr><th>P.O. &amp; Supplier</th><th>Status</th><th>Docs</th><th>Pay Slip</th></tr></thead><tbody><tr><td><button class="acc-po">NCT-PO-EXAMPLE</button> <span class="acc-pill red">⚠ Urgent Payment</span><small>EXAMPLE SUPPLIER SDN BHD</small></td><td><span class="acc-pill gray">Reviewing Docs</span></td><td><div class="acc-docs"><button class="acc-doc green">PO</button><button class="acc-doc green">PI</button><button class="acc-doc orange">DO</button><button class="acc-doc orange">INV</button></div></td><td><button class="acc-slip orange">'+waiting+'</button></td></tr><tr><td><button class="acc-po">NCT-PO-COMPLETE</button><small>EXAMPLE SUPPLIER SDN BHD</small></td><td><span class="acc-pill green">Fully Paid</span></td><td><div class="acc-docs"><button class="acc-doc green">PO</button><button class="acc-doc green">PI</button><button class="acc-doc green">INV</button></div></td><td><button class="acc-slip green">'+icon+'</button></td></tr></tbody></table></section><h2>Record Payment</h2><label class="proof-upload">Upload proof <input type="file" disabled></label>';
 const warehouse='<h1>Warehouse Department 仓库部</h1><div class="warehouse-track"><div class="track-item WAITING" data-count="3"><span class="track-capsule"><b>3</b></span><p>Waiting 待收货</p></div><div class="track-item PARTIAL" data-count="2"><span class="track-capsule"><b>2</b></span><p>Partial 部分收货</p></div><div class="track-item ISSUE" data-count="1"><span class="track-capsule"><b>1</b></span><p>Issue 收货异常</p></div><div class="track-item COMPLETE" data-count="4"><span class="track-capsule"><b>4</b></span><p>Complete 已完成</p></div></div><table class="warehouse-table"><thead><tr><th>Order</th><th>Received</th><th>Status</th></tr></thead><tbody><tr><td>NCT-PO-PENDING</td><td><span class="item-count">10</span></td><td><span class="status WAITING">Waiting</span></td></tr><tr><td>NCT-PO-COMPLETE</td><td><span class="item-count done">20</span></td><td><span class="status COMPLETE">Complete</span></td></tr><tr><td>NCT-PO-ISSUE</td><td><span class="item-count">2</span></td><td><span class="status ISSUE">Issue</span></td></tr></tbody></table>';
 const support='<h1>Support Department 支援部</h1><table class="support-table"><thead><tr><th>Customer</th><th>Invoice</th><th>Documents</th></tr></thead><tbody><tr><td>EXAMPLE CUSTOMER</td><td><button data-invoice="sample">Create Invoice 创建发票</button></td><td><span class="dot">●</span> Waiting</td></tr><tr><td>EXAMPLE CUSTOMER</td><td><span class="account-icon complete">'+icon+'</span></td><td><span class="stock-green">Ready</span></td></tr></tbody></table><h2>Task signals</h2><div class="task-signals"><button class="task-signal has-work">Pending <b>3</b></button><button class="task-signal urgent has-work">Urgent <b>1</b></button><button class="task-signal">No work <b>0</b></button></div>';
 document.querySelector('iframe').srcdoc='<!doctype html><meta charset="utf-8">'+(room!=='purchase-live'?'<link rel="stylesheet" href="../../account-room/style.css">':'')+css.map(h=>'<link rel="stylesheet" href="'+h+'">').join('')+'<body>'+shell+'<main id="app">'+({'purchase-live':purchase,'account-room':account,'warehouse-room':warehouse,'support-room':support}[room])+'</main></body>';
}
document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>render(b.dataset.room));render('purchase-live');
</script></html>
