<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FMCG Malaysia Buyer Room Login</title><style>
:root{--ink:#071d18;--muted:#58645f;--paper:#faf9f6;--orange:#f4511e;--orange2:#ff672e;--green:#0b4c3a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI",Arial,sans-serif;background:var(--paper);color:var(--ink)}body{display:flex;align-items:center;justify-content:center;padding:28px 34px}.card{width:min(520px,100%)}.eyebrow{display:flex;align-items:center;gap:14px;margin:0 0 28px;color:#52615b;font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase}.eyebrow:after{content:"";width:34px;height:2px;background:var(--green)}h1{font-size:48px;line-height:1.03;letter-spacing:-1.7px;margin:0 0 14px;font-weight:850}.intro{margin:0 0 28px;color:var(--muted);font-size:17px;line-height:1.5;max-width:480px}button,input{font:inherit}.google,.signin{width:100%;height:56px;border-radius:7px;font-weight:800;cursor:pointer}.google{border:1px solid #cbd1cd;background:#fff;color:#18201d;display:flex;align-items:center;justify-content:center;gap:13px}.google:hover{background:#f6f7f5}.g{font:900 24px Arial;color:#4285f4}.g:before{content:"G"}.or{display:flex;align-items:center;gap:18px;margin:22px 0;color:#646c68;font-size:12px}.or:before,.or:after{content:"";height:1px;background:#cfd4d0;flex:1}.field{position:relative;margin:0 0 14px}.field input{width:100%;height:56px;border:1px solid #c7cdca;border-radius:7px;background:#fff;padding:0 48px;color:var(--ink);outline:none}.field input:focus{border-color:#0d7252;box-shadow:0 0 0 3px rgba(13,114,82,.12)}.ico{position:absolute;left:16px;top:17px;width:22px;height:22px;color:#76807b}.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8}.toggle{position:absolute;right:12px;top:10px;width:36px;height:36px;border:0;background:transparent;color:#69736e;cursor:pointer;font-size:18px}.signin{border:0;background:linear-gradient(90deg,var(--orange),var(--orange2));color:#fff;margin-top:2px}.signin:hover{filter:brightness(.96)}button:disabled{opacity:.6;cursor:wait}.status{display:none;margin-top:13px;padding:11px 13px;border-radius:7px;font-size:12px;line-height:1.4}.status.show{display:block}.status.wait{background:#fff1df;color:#805100}.status.ok{background:#e7f5ec;color:#09643f}.status.err{background:#fdebe7;color:#9a2d1d}.actions{border-top:1px solid #ccd2ce;margin-top:28px;padding-top:22px;display:grid;grid-template-columns:1fr 1px 1fr;gap:20px;align-items:center}.actions i{height:34px;background:#cbd1cd}.link{border:0;background:transparent;color:#18201d;padding:8px 0;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;font-weight:650}.link:hover{color:var(--orange)}.link svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7}.note{margin:18px 0 0;text-align:center;color:#7a837e;font-size:10px;line-height:1.5}@media(max-width:680px){body{padding:28px 22px;align-items:flex-start}.card{padding-top:14px}.eyebrow{margin-bottom:21px;font-size:9px;letter-spacing:2.2px}h1{font-size:38px}.intro{font-size:15px;margin-bottom:23px}.actions{grid-template-columns:1fr;gap:7px}.actions i{display:none}.link{justify-content:flex-start}.google,.signin,.field input{height:54px}}
</style></head><body><main class="card"><div class="eyebrow">Trusted products · Stronger businesses</div><h1>Welcome to<br>Buyer Room</h1><p class="intro">Your gateway to Malaysia's best FMCG products, trusted suppliers and bigger opportunities.</p><button id="google" class="google" type="button" aria-label="Continue with Google"><svg class="google-mark" aria-hidden="true" viewBox="0 0 24 24"><path fill="#4285F4" d="M21.35 11.1h-9.18v3.71h5.29c-.23 1.19-.9 2.2-1.91 2.88v2.39h3.09c1.81-1.67 2.85-4.13 2.85-7.04 0-.67-.06-1.32-.14-1.94Z"/><path fill="#34A853" d="M12.17 21.5c2.59 0 4.77-.86 6.36-2.33l-3.09-2.39c-.86.58-1.96.92-3.27.92-2.5 0-4.61-1.69-5.37-3.96H3.61v2.47a9.6 9.6 0 0 0 8.56 5.29Z"/><path fill="#FBBC05" d="M6.8 13.74a5.77 5.77 0 0 1 0-3.68V7.59H3.61a9.6 9.6 0 0 0 0 8.62l3.19-2.47Z"/><path fill="#EA4335" d="M12.17 6.1c1.41 0 2.68.49 3.67 1.44l2.75-2.75C16.93 3.24 14.76 2.3 12.17 2.3a9.6 9.6 0 0 0-8.56 5.29L6.8 10.06c.76-2.27 2.87-3.96 5.37-3.96Z"/></svg><span>Continue with Google</span></button><div class="or">OR</div><form id="form"><label class="field"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg></span><input id="email" type="email" autocomplete="email" placeholder="Business Email" required aria-label="Business Email"></label><label class="field"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span><input id="password" type="password" autocomplete="current-password" placeholder="Password" required aria-label="Password"><button id="toggle" class="toggle" type="button" aria-label="Show password">◉</button></label><button id="signin" class="signin" type="submit">SIGN IN</button></form><div id="status" class="status" role="status" aria-live="polite"></div><div class="actions"><button id="apply" class="link" type="button"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20v-2a5 5 0 0 1 10 0v2M14 20v-1.5a4 4 0 0 1 7 0V20"/></svg><span>Apply for Buyer Access</span></button><i aria-hidden="true"></i><button id="contact" class="link" type="button"><svg viewBox="0 0 24 24"><path d="M4 13v-2a8 8 0 0 1 16 0v2"/><path d="M4 12H2v5h4v-5H4Zm16 0h2v5h-4v-5h2ZM18 19c-1 2-3 2-5 2"/></svg><span>Contact Our Team</span></button></div><p class="note">Buyer access is limited to approved business customers.<br>New applications are reviewed by FMCG Malaysia.</p></main><script>
const $=id=>document.getElementById(id),status=$('status'),signin=$('signin'),google=$('google');function post(type,payload={}){window.parent.postMessage({type,...payload},'*')}function setStatus(text,kind='wait'){status.textContent=text||'';status.className=text?'status show '+kind:'status'}google.onclick=()=>{setStatus('Opening secure Google sign-in…');post('BUYER_LOGIN_GOOGLE')};$('form').onsubmit=e=>{e.preventDefault();signin.disabled=true;setStatus('Signing in securely…');post('BUYER_LOGIN_EMAIL',{email:$('email').value.trim(),password:$('password').value})};$('toggle').onclick=()=>{const p=$('password'),show=p.type==='password';p.type=show?'text':'password';$('toggle').setAttribute('aria-label',show?'Hide password':'Show password')};$('apply').onclick=()=>post('BUYER_APPLY_ACCESS');$('contact').onclick=()=>post('BUYER_CONTACT');window.addEventListener('message',e=>{const m=e.data||{};if(m.type==='BUYER_LOGIN_STATUS'){signin.disabled=false;google.disabled=false;setStatus(m.message,m.kind||'wait')}if(m.type==='BUYER_LOGIN_BUSY'){signin.disabled=true;google.disabled=true;setStatus(m.message||'Checking your buyer access…','wait')}});post('BUYER_LOGIN_READY');
</script></body></html>
